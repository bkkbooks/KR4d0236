body:
  text: 香山集卷五宋喻良能撰五言律詩題三洞千古巢仙地嵌空本自然一看三嘆息十步九留連似入華陽洞疑通小有天何時洗塵垢來作枕流眠三月六日宴李家園亭林園過元巳流水繞芳藂略彴半尋影酴醿一扇風杯盤花氣裏枕簟鳥聲中公子敬愛客月明樽未空郊行散䇿林塘路秋深别有光晦明雲聚散濃淡樹青黃晚覺衣襟冷風吹橘柚香菊花何處有聊欲試重陽次韻季野弟蠟梅媚色全勝栁孤標半似梅蘂寒金粉膩香重麝臍開徐筆那能畫并刀未易裁扶頭中酒味安得一枝來讀書傍砌看黃妳臨池誦子虛顧慚雖耗忘聊復惜居諸屋上兩鸜鵒波間雙鯉魚疑他不識字何事也聽書栁子厚答許京兆書神志荒耗前後遺忘讀玉局集曉讀蘇仙集披翻未覺勞衙官視宋玉奴僕命離騷赤壁清風逺黃樓逸興髙獨嗟生苦晚不得侍揮毫留别伯夀兄相過不憚逺相迎慰所思須知對床處絶勝陟岡時夜雨論疇昔秋風惜别離明年楚東景凖擬共題詩之官桐川道中口占登道重逢驛離家再及晨雲輕山色曉寒淺鳥聲春碧澗梅花老銀杯竹葉新前途風日好持用悅慈親戲綵堂有作捧檄及偏親斑衣聊效顰㫖甘貧有味溫清靜無塵北户足萱草南風宜棘薪版輿多喜色庶不愧安仁堂之前有棘一樹次韻趙景明呈許明府卜晝開英集瑶林映碔玞顧慚梅隱吏繆接范萊蕪官栁春猶淺江梅韻亦孤他年想風味應有汭川圖對鏡芙蓉二嶺相望僅三十里髙不知幾百尺十步九折殆不啻蜀道之難也己卯孟秋沿檄過之僕夫告痡已亦罷極因成小詩石鏡寧堪對芙蓉不是花險中多虎跡平處少人家曲六蛇行逈欹危鳥道斜白雲宜入望不怕亂山遮九日同尤司户舟行遊梅山令節逢重九相攜鑑上遊扁舟浮舴艋左手把蝤蛑紅葉明青眼黃花重白頭晚來風色好歸棹得夷猶題聽雨軒小軒在官舍不與囂塵并清池浸窗檻修篁礙簷楹幾當迢迢夜聽此瀟瀟聲懷哉對床約輾轉難為情晚行竹山道中山瘦溪如練丹青見亦稀亂鴉將影過孤鶩帶霞飛秋色此時老故園何日歸西風吹獨立搔首怯征衣始生之日黎明以職事出郊征鞍隨曉色重露濕衣巾誰謂懸弧日翻為執轡辰野花工笑客啼鳥故窺人呼酒澆孤悶何心作好春朝爽之前瑞竹忽生好竹逾千箇數莖忽發生月明連理影風細合歡聲矯矯雙鴛舉翛翛兩鳯鳴秪應三昧手綵筆畫難成端午至太平寺客裏逢端午僧廊雨氣涼篔簹千箇碧簷蔔六花香魯頖程尤逺潘輿興自長糝蒲傾美酒笑入醉中鄉題九華山用太白聨句韻千古池陽郡九峰應最華明珠絢晨露麗綺粲晴霞嶺頭過子晉巖腹憩洪崖謫仙無復見空想夏侯家題建德驛用經略張舍人壁問韻殘暑塗山去涼風至德來吟餘秋色老客裏菊花開傳舍全依石中庭半是苔張公有佳句三復興悠哉新安遇雪寒色今朝異屯雲萬里同定知花翦水不是絮因風薄宦翻成旅愁吟未易工白頭親八十留滯楚江東次韻謝子良詠雪晚來寒氣重景物故撩人不厭詩雕腎寧辭酒入唇恍驚殘夜月疑夢故園春欲倩何人畫紛紛飛玉塵青巖道中寒食江村路東風野渡航一篙春水碧兩岸落花香飛絮匆匆逺青山故故長兹遊自竒絶底用更尋芳周少府由姑熟送余同宿于玩鞭亭相别古桃郡相逢南豫州五年勞望眼一笑失離愁碧水溪橋暮西風野店秋追隨成夜宿不為玩鞭留寄陳孟容二首先生湖海士餘子詎能班正始清談近黃初美句還相望半舍外契濶數年間何日衡茅底匏樽一破顔細草還堪藉柔荆亦可班馭風如肯過踏月不妨還種藥臨花畔分流繞竹間眼邊無俗物頗似一瓢顔廣信道中昔日題詩處重來續勝遊緑隂初入夏蒼鬢幾經秋細雨渡頭市孤煙汀際舟溪山雖信美翻恨不淹留次韻侍御晚宿三叉口故里頻懷梓新堤未築沙文章真吏部吟詠許劉義酒盞孤風物詩筒隔嵗華相思江路逺煙雨茁芳葭書大洞僧壁招提閟林麓魚鼓白雲邊地僻疑無路山深别有天幽花充佛供好鳥伴僧禪何日征鞭暇重來借榻眠寒食遊香山杖藜隨所適花栁自村村野岸桃臨水人家竹映門香泥飛燕子芳草思王孫著處堪沈醉春醪正滿樽被郡檄禱雨丹井山徐真君祠登山拜畢即獲􅗈霈追用韓文公郴州祈雨韻欲解驕陽厄寧辭祀禮繁純誠殫毣毣英烈仰言言雲陳千屯合雷聲萬馬奔晚來歸路好飄灑勢騰軒紫霄宫間關穿木杪詰屈轉山腰自昔形清夢于今到紫霄容儀粲冰雪環珮響瓊瑶安得顧吳手慿渠圖素綃攝邑獄空番邑於今劇民風自古雄琴堂慚久攝劍獄喜新空纒索塵埃裏桁楊片段中使君端不擾顧我百無功石井山右最佳處有泉生石傍虛明秋後月清冷雪前霜鰻井真牛後龍湫可鴈行濯纓仍潄齒政爾不能忘游西源萬里西源路秋風屐齒鳴嶙峋千障碧窈窕一川清天柱雲霄逈香爐霧靄輕何當攜翠袖重遣酒壺傾奉和趙大本教授何處春深好二首何處春深好春深泮水家不妨頻折角寧復誤隨車已見傾三峽行看判五花日邊催覲速芝檢紫泥斜何處春深好春深倅二家雨低簷外栁風度牖間花有意揮吟筆無心顧麴車慈顔一笑粲戲舞綵衣斜景德道中口占捧檄東方日芳春未及歸路花紅掩映溪樹緑因依鳥語催寒食人煙接翠微尋詩忘逺近細雨濕征衣由安仁回宿大木寺御史題詩處山深草木雄一番青燒雨十里錦帆風婆餅林間語山茶葉上紅明朝入於越吟詠與誰同奉酬王宗丞用宿大木寺韻見贈譽處千鈞重文章一世雄詩工穿月脅檄好愈頭風北嶽關山碧南州荔子紅使君今北海還許一樽同送侍御帥䕫府湖海番君國江山白帝城凝香餘坐嘯飛詔趣遄征譽處千鈞重輜車一羽輕攀轅雪眉老送目逐雙旌千古楚東郡風流今在兹魯公元直道文正不妨詩鉗吏似束濕麾龍如使兒甘棠足遺愛㑹有去思碑西風動行色詩景繞征鞍赤甲懸危壁黃牛㵼急湍猿聲雲背落山勢馬頭盤天險須人守毋辭蜀道難諸葛仍祠廟公孫只故基棟梁酣夕照雉堞蔓秋葵耿耿登臨意悠悠今古思烹鮮不勞力餘事杜陵詩四海猶多事中原未版圖皇心思啓沃赤子望霑濡八陳難留滯三階拱進趨茂𢎞寧有意江左待夷吾被檄之上饒言還未幾又復往焉至小渡遇雨遣興一首檄至方云急吾行敢滯留朔風經小渡細雨過中洲小渡中流有洲名中洲冉冉新斑鬢飄飄敝黑裘欲知來往久三見月如鈎九月五日周少府衛秀才㑹飲吳波亭周有詩因次韻碧水初微落黃花亦未簪三人千里客尊酒五年心我獨年齊白樂天云不覺身年四十七余今年與之齊矣君皆句似隂不妨鐺腳坐聊作夜深吟次韻王侍御夜宿髙牙相别三時久相望萬里賖攜書期過雁徙倚至昏鴉風雨番君國雲煙䕫子家何時趣歸覲重許拜髙牙至日見梅漸老身仍健多愁鬢易華異鄉逢至節細雨見梅花酒薄那能醉詩成敢自誇何時故園裏徙倚看橫斜次韻俞尉春日遣興漸欣長晝暖欲解短爐圍春色已如此故園猶未歸韋編今日事回首去年非鏡裏衰遲色多慚壯志違留别趙明府綵棒漫分部牛刀新發硎花城方竊䕃瓜戌巳餘蓂生計雙蓬鬢歸心幾驛亭他時重㑹面應是眼俱青初離鄱陽三年勞簿領今日進歸程意與長途逺身兼薄縠輕板輿頻送喜山驛屢逢晴道上人爭指霜髭綵戲榮衢右道中投曉行衢右經旬别楚東侵衣梅溽雨吹面麥秋風壠畝凝煙外峰巒滴翠中懸知鄉井近漸喜語音同漸喜家居近相望六驛間脫身江左役洗眼浙東山鄉味初充饌慈闈亦破顔經過縠溪水應笑鬢毛斑村居夜坐讀王右丞山中與裴迪書愛其清婉有魏晉風味因集其語作詩一首亦老坡哨遍之義也景氣既和暢故園殊可依逺山映清月曲水涵淪漪寒犬吠如豹村舂聞自機因思曩昔友攜手同賦詩獨善堂賞心并四者文史足三餘不作簪紳念唯便水竹居佳名元籍籍真樂每如如月旦遺評在今經幾建除靈山寺松竹聲中寺山深人迹稀石從林背出雲向屋頭飛野鹿寒仍聚棲禽暮自歸怪來襟袖冷濃翠濕征衣買舟至九里松遊三天竺解維凌皺玉輟棹理孤笻遊遍三天竺行窮九里松泉聲依石細山色共秋濃佳處吾能識幽巖倚秀峰

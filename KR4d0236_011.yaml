body:
  text: 香山集卷十一宋喻良能撰七言律詩次馬撫幹韻贈黃泰之狀元褎然射策向明光紫禁春深日正長風細御爐烟冉冉天晴宫栁絮茫茫玉階親奉唐虞問綵筆濃薰班馬香千佛經中名第一鴻文端不數長楊次韻王侍御題詩史堂欲識當年泣鬼神詩皆絹婦與虀辛洗空千古無凡馬稱到於今有幾人肯與齊梁充後乘只應蘇李是前身豐碑更著最佳處傳示宜過一萬春十月二十三日擕家遊裴園笋輿趁曉踏銅駝休暇仍逄景色和閒挈壺觴游翠靄盡呼兒女看滄波茫茫烟渚羣鷗下隱隱晴虹短棹過最是小春竒絶處梅花破萼未全多謝中書施舍人宴集紫微髙義篤同年邃宇開筵近臘寒緑醅濃粘玉盞紫駝峯美照金盤醺酣上頰生春意文字清談卜夜䦨更辱盤飱餽黃髮顧慚珍報乏琅玕試諸生直廬書事長日初隨綵線還隂隂簾幕曲欄干白袍三百近洙泗青桂兩株如廣寒下筆萬蠶爭食葉為文三峽瀉驚湍誰知潦倒真無補不愧無氊愧素餐安撫大資李參政生辰十二月十四日仙李盤根幾百秋我公勳業比伊周推恩已解宏元化戢患猶能庇七州不日定為黃閣老他年應伴赤松游三江願得渾為酒夀斚年年給獻酬嵩嶽生申占臘前預將和氣作春妍蟠桃結實三千嵗蓮葉成巢幾百年聊向蓬萊開燕寢即紆衮繡畫凌烟貞觀功臣皆生畫像凌烟閣只應便是神仙事方丈瀛洲却未然次韻宋嗣宗梅花野外江頭一樹垂正當霜後臘前時清如𢎞景松臨閣韻似淵明菊映籬鐵石廣平曽作賦風流水部亦哦詩却愁折向粧臺下莫遣佳人取次知洗盡紅粧見玉顔一年相别此時看房陵粉水休爭白姑射氷肌巧耐寒自愛一枝橫竹外未須千樹繞江干東風也是相欺得已作和羹一㸃酸次韻謝察院田寺丞倡酬之作兩翁辭采偶同時春草還應夢謝池出月穿天端有意掀雷抉電豈無期推門不作孤吟苦擊鉢猶嫌得句遲顧我無才難入社焚香時許誦清詩平湖平湖瀲瀲浸葱蒼畫出風烟十畝强蜜曲六從霜後熟玉芙蓉向露中芳新開石洞連松碧低結萸房映菊黃最愛隄邉秦地栁一回春到一回長思歸五載懷歸不得歸故園想像每依依蠶生村落桑黃長麥熟田家稚子肥谷烏緩歌金縷曲籜龍渾著老萊衣一篇未就張衡賦漫向成均詠式微挽周子及灑落孤標逈不羣胸羅星宿富多文兩科擢第未為貴八事籌邉堪策勳鯁亮諌辭端似賈﨑嶇宦路僅勝蕡我慚不執雲溪紼空望雲溪溪上雲顯謨左司周公元吉將漕湖北一時名流賦詩餞行豫與左司同出於詹事周公之門為同門同居班列二年為同朝同考類試於貢闈為同寮三者既同契好彌篤於其行也作長句以送之微雲疏雨凉新秋皇皇玉節摻不留夫君不憚原隰險聖主坐寬宵旰憂巴音聊復祖行色楚水恨不尾仙舟籍籍預傳新漕挽汗青未數富民侯黃泰之郎中以潮陽詩見貽次韻一篇奉酬千里潮陽喜政成五年重㑹帝王城尺書不寄頭俱白一笑相逢意已傾輝采共看新列宿風流猶記古州瀛詩編總是驚人語怪得年來太瘦生贈樓尉誰識尊前戲綵身鬚髯如棘鬢如銀久為朝士空餐甚又見秋聲滿耳新元亮秪思三徑樂子雲何事九衢塵襟期蘭契如君少未可匆匆動去輪挽提宫知丞周公妙齡馳譽滿東吳落筆驊騮走坦途四十年來鳴道學一千人內最羣儒甲子鄉舉用經術以書義試者千餘人公為之最二松不負經綸志三徑真成隱遁娛老我與君端莫逆遺文時閲漫長吁送曽大卿將漕江東公去何嘗負二宜要持玉節瑞明時江畿列郡皆爭睹臺閣名流總賦詩鵰鶚暫為雲外舉鳯凰終集上林枝近臣侍從多虛位㑹見回帆春色隨悼吳居厚學問從來著月評慈恩何事缺題名賢哉難老堂雖就惜也陳情表未成疇昔幾回同把酒於今一涕獨霑纓張公當日稱操履江漢傷心晝夜傾由之流溪回亭午苦熱小憩牧馬寺長途畏日欲流金聊向招提覔快襟翠合苔㾗人寂寂凉生柏影院深深苦無俗物敗佳思况有寒泉醒客心一餉清風寄蘄竹又飛征蓋指城隂九日偕成均同官北山登髙二首輕霞朝日兩微茫沙路駸駸十里强照水有情楓葉赤倚崖無數菊花黃興酣爭舉凌雲筆醉熟重浮灔海觴明日蝶愁人亦懶未須歸去苦匆忙之官括蒼道出涵碧因題四韻以繼賔客劉公之後塵云平生性僻耽山水不願加封萬户侯但得雙魚長到眼未須萬壑更爭流只今竒絶齊三洞自昔流傳遍九州記得當年小盤礴坐令炎赫變清秋再遊東陽十年不到還重來往事一夢真悠哉尋幽已訪涵碧寺乘興欲上吳寧臺蒼松怪石雖飽覽黃鈿拒霜猶未開白雲西來入我念又馭兩腋清風回松峭山傍偃松昔嘗過之為賦長句今三十有六年矣復至其下慨然有感因次韻人日肩輿度曉峯長松偃蹇倚晴空幾年不見根如鐵老境重來鬢似蓬獨樹未須誇老杜五楸那復論韓公青幢翠蓋貌難似想見霏霏烟雨濛遊下巖過松峭祠傍偃松又賦長句誰將秋色替雲峯萬里炎歊一洗空細雨復青池上草西風頓白鬢邉蓬聊同吾黨二三子來訪山中十八公更擬夜深乘月到要看香霧共冥濛州宅古栝提封接日畿專城皓首有光輝全家飽暖君恩重屬邑豐登公事稀一簇樓臺居洞府四時風景對屏幃多慚郎省無禆補丐外猶能占翠微次韻奉酬王給事見貽之什誰知州宅似精廬山繞簷楹水繞除堂靜惠風長細細樓髙烟雨又疏疏貧如坡老工餐菊性似邉韶懶讀書賴有嵩山王給事作詩貽贈問何如簽㕔落成為賦長句幕中英俊許誰先一一驊騮擬著鞭老我漫誇森畫㦸夫君端稱泛紅蓮鳩工已見成輪奂載酒何妨醉聖賢聞道公餘多暇隙定持椽筆籋雲烟對㕔口號歡聲喜氣溢黃堂解愠風清化日長簪紱盡傾千里目冕旒遙祝萬年觴韻敲碧玉檀欒嫩色鬭紅粧菡蓞香共慶龎恩新浹洽聖君文母夀無疆十一月十日同幕府諸公游郡圃葉撫屬得梅花一枝馬撫屬有詩因次韻橫枝十月要清詩南國今年爾許遲夢繞故山千疊疊眼看新萼一枝枝欲知影瘦香微處未稱天寒日暮時却憶玉溪當日樹淺霜深雪總相宜次韻木藴之狀元義烏道中一首奔走塵埃老未休每思上下兩巖稠義烏有上稠巖下稠巖關心簿領三書考回首家山兩換秋搘腹自憐鷦鼴小江湖誰計鴈鳬留又遮西日長安去慚愧平生馬少游送黃機宜叔愚歸省四明灑落孤標第一流笑談傾座氣橫秋聊參機密東州幕曽與風流玉局游黃自言及見東坡聽雨忽驚形夢寐臨風那肯更遲留橘堂想像多佳致恨不追參李郭舟聽雨橘隱公軒堂名愛山公子漫誇金谷富先生秖愛玉川貧山中矯矯七君子堂上皤皤四老人時引壺觴聊自醉肯教鵝鴨惱比鄰深紅淺白兼穠紫看取林園十畝春彥禮知丞上巳過訪流觴於愛山之曲水年來曲水競流觴元巳夫君訪草堂波撼石麟杯斚亂風翻花片笑談香哦松適意清篇富閉户端憂白日長更約來年春好處重來相與醉滄浪次王待制維舟弄水亭韻萬里浮江更絶湖扁舟東入霅川圖莫言舊菊荒三徑須信中流待一壺今日詩筒煩逺寄昔年樽酒記相呼待制昔嘗惠詩云樽酒相呼恨不多立朝大節人能說月在清天影自孤三月二十四再到永祐陵扁舟投曉出重城春浪初肥緑滿汀竹裏幾聲泥滑滑河邉十里草青青人家艾葉驚飛燕水靣楊花㸃翠萍漸近昭陵佳氣集五雲松柏喜重經己酉中秋磬湖秋半溢清波一嵗月明今夕多剩辦新詩娛老境滿傾太白醉氷娥一天風露寒衣袂舉室兒童雜笑歌不是鈷潭竒絶處未妨丁夜更娑婆盆池小鑿方池供醉吟才添斗水浪偏深瑩心未數寒泉井明目何須寸碧岑樹影落時清浸玉魚鱗動處細浮金年來㸃檢曽經汲唯有澆花趁日隂中秋愛山玩月年年秋半在長安今夕園林且盡歡一笑團欒人似月十分瀲灔酒生瀾遍簪丹桂香巾袂盡吸清輝澡肺肝飲罷月斜吟興動揮毫風露一天寒次韻何茂恭重陽前二日見過西風籬落興悠然秋影橫江鴈貼天短髮未成吹帽飲髙吟先贈把茱篇黃花一笑小重九青眼相看又四年欲試烟波釣竿手南湖同上月明船磬湖之側纍拳石為山巖谷幽邃有巫廬台霅之趣因成短篇背湖臨檻碧崔嵬萬壑千巖咫尺開坐覺巫峯天際落忽驚廬阜眼中來地偏未害心還逺潭小何妨水自回竟日相看兩不厭老夫真箇似童孩次韻奉酬參議林郎中見貽之作紫宸疇昔幸同朝去國俄驚數舍遙輕細難沾時服賜氤氲正想御香飄年加賴有斑衣戲心靜真同桂隱招龍瑞此時探禹穴天津何日渡京橋自題木假山根幹輪囷蔽馬牛何年飄泊寄滄洲幽巖邃壑漁罾得百巧千竒雲浪鎪好喚老泉來作記肯將居士與同遊畢宏韋偃丹青妙畫得天然意緒不次韻奉酬茂恭送茉莉重臺白蓮異暑歊然金欲流縞裙練帨兩宜秋笑他山谷誇黃鈿欲學令狐賦白樓粉筆有心爭試巧紅粧無靣可障羞明來自足映茒屋况有詩輕萬户侯亦好園海棠秋開紅英滿樹微雲淡日映寒流畫出西園一幅秋白帝幻成紅玉蘂金風吹綻碧枝頭睡餘艷艷真妃子夢罷愔愔一解愁熟賞細看須著句為君重賦紫綿揉後蜀潘炕有美妾解愁其母夢吞海棠花蘂而生頗有國色次韻張持荷桂花别駕風流繼竹林名園幽榭水雲深勻鋪葉底森森碧細糝枝頭粟粟金酒酌香浮杯靣蟻詩成霜灑月中砧清芬冉冉仍多韻不比晴窗一穗沉庚戌中秋病起言懷病來十日不飲酒起對中秋良可人銀漢迢迢清未了金波瀲瀲淨無塵艷歌未暇成三疊美醖何妨釂十分記得昔年當此景厭厭夜飲在成均乙巳中秋芳潤軒玩月飲酒甚適九日亦好園小集疏雨蕭蕭岩桂香西風驅冷作重陽池塘秋草還爭緑籬落寒花未肯黃又是一年新度節何妨九客共飛觴園亭低小殽蔬陋不比龍山吟帽狂雪密雪乘風逞素肌穿窗透隟入簾幃漫空隱隱瓊瑰屑亂眼紛紛鷗鷺飛三客新成梁苑賦六花又舞謝莊衣回思拜表明光罷擕得香烟滿袖歸長風永夜攪青冥曉起寒光亂眼凝回旋舞空端入畫飄蕭著水自成氷松篁被練三千士岡阜瑶臺十二層茒舍倍添薪火費只因無事讀書燈題淵明祠堂案此詩以下二首據南宋名賢小集增入宅邉雖有五栁樹歸去已荒三徑園平生胸中羞五斗偶爾城市羡華軒盈樽濁酒自可漉得趣古琴那用絃欲知耿耿忠憤意甲子斷自永初年輦下言懷馬蹄重踏帝京塵七載江湖飽問津白髮有人疑甲子清齊無日不庚申不才詎敢誣明主厚祿那能羡故人乞得泮宮閩粵去未妨閒處著吾身

body:
  text: 香山集卷十五宋喻良能撰七言絶句送師相陳大觀文地總全閩控百蠻政成治最二年間五千里見耕桑盛百萬人欣日月間狂風吹海向來驚玉帳分弓射怒鯨千里妖氛都鏡淨商船載月夜深行頻年秋稔榖相因八郡恩波著處勻長樂城中家幾萬家家生子總名陳化國熙熙日自遲棠隂無訟草含滋何人剩伐南山石大刻詳書德政碑裴令有心吟緑野贊皇作意向平泉君王夜半思元老明日金甌寶墨鮮黃童白叟走踆踆總向城邊擁去輪願為此邦聊小駐公歸誰作萬家春將令四海變虞唐那得夔龍滯一方寄語邦人休卧轍道傍行看舍人裝溶溶曳曳白雲間救旱濡枯頃刻間四海蒼生望霖雨謝公早晚起東山朱朱白白總精神共喜今年化筆勻尚有窮鄉寒谷土政須一氣轉鴻鈞桐廬舟中急槳如飛破浪紋子陵灘下水沄沄江風初靜扁舟穩卧看青天行白雲望湖亭倚欄遙望賀家湖千頃波光半欲蕪試問青銅未消蝕西湖得及此間無賀知章祠乞得君王一曲湖笑他三徑就荒蕪欲知千古髙風在月落寒山影自孤鑑湖憶昔未曾遊鑑水畫圖髣佛見非真年來飽泛同苕霅寧愧江湖舊散人弄水亭次李察院韻清溪一曲抱危亭天水無塵相與明昔日紫微今御史兩翁詩句一般清題五泄瀑布四首玉龍千丈自夭矯飛雨十里長廉纎愚栁一見心眼爽未須界圍觀水簾香爐太白有佳句鴈蕩老坡題畫圖安得二仙居至此新詩想見唾成珠越絶徒聞萬壑流他山未比此山幽誰云十地有熱惱但覺三伏生涼秋瀑雨霏霏濕翠嵐來從天半許誰探凌空踏盡崚嶒石始到峰頭第一潭緑毛龜白玉盆中淺更清緑毛浮水鬭輕盈須臾食罷渾無事自上盆山頂上行禹帝祠道中薰風正欲拂江梅去嵗兹晨宿霧開新竹出墻荷貼水今年潦倒又重來窆石禹陵蹤迹頗堪疑窆石衣冠知幾時猶解起人河洛思可憐大勝嶧山碑菲飲泉和韻不覺當年室與宫菲泉猶得想遺風至今美食鮮衣者不敢緣窺緑淨中陪胡少卿登山瞻禹陵考古年來喜有徵相擕步步上崚嶒皇華使者歸朝著好為詩翁説禹陵鵝池空餘青李與來禽寶墨知誰是賞音未若山隂羽衣客等間猶識愛鵝心秦望閣傲睨須知古有秦却將黔首等微塵當時虛上峰頭望不見桃源避世人定泉兹泉定力冠諸泉故向空山獨湛然終日虛明無一物客來惟見浪痕圓登望海亭誰將龍脊置新亭一餉登臨耳目醒欲識海門山盡處爛銀堆裏數螺青題智者雙清堂潦收池淨見魚行木落山空鳥語鳴更待夜深來徙倚要看霜月鬭波清磨勘轉朝請郎脫身畎畝簉簪紳父母妻孥均沐恩百年七萬二千飯要須一飯不忘君乙未詠梅疏枝倚竹更臨池一餉清寒瘦雪肌恰似玉兒初識面朱唇蘇頰總相宜湖上二絶輕隂疏雨帝城西目斷裙腰緑正齊處處春風圍繡幕行雲莫與濕障泥初過百六見梨花堤路煙輕雨更斜玉雪一枝端可念栁絲深處水邊家天申節明慶寺啓建兩鬢蕭蕭華髮生欲尋江上白鷗盟皇恩却許陪鵷鷺重聽景陽鐘鼓聲雨中至上竺雲滿千山雨滿川肩輿來禮白衣仙山間秋色知多少總在危簷繚檻前聞莊鵬舉山茶小盆葩華雜然有意舉以見遺因作詩求之琉璃翦葉碧團團收拾繁枝徑尺寒舉贈詩翁知有意要令飽看鶴頭丹送王季海敷文赴閩漕鐵冠慷慨老臣風諫紙雍容補衮功久以精忠簡天上暫將和氣到閩中諫省歸來三載餘君王應渴見鴻儒七閩重地誰能漕聊出長才為轉輸聖主方懷南顧憂且煩持節按閩州政成早作朝天計兩地端須第一流追憶王詹事何知録平生師友子王子四海襟期録事君白髮紅顔俱異物髙山流水欲誰聞直廬鎖宿呈監丞宋文軒窗空洞惟修竹風韻時時自琴築學省蕭然冷欲冰兩翁相對清如玉懷亦好園釣磯寄仲文季直二弟磬湖雨過漾清波古岸秋來長薜蘿問訊石君無恙否試煩著手為摩挲蚊聲如蛾唱更悠揚透縠穿紗喙許長莫倚傳呼工噬嚙須知十月有清霜題藍田松竹圖風姿凛凛千君子冠劍堂堂兩大臣著我中間哦五字只應斯立是前身送終南函谷二圖還司路鈐平生飽看江湖景所恨未遊關輔山一朝圖畫入吾手似到終南少室間次韻林參議致甫以詩見索近作朝行欵接已彌年會府重逢意豁然好酒未容千日醉惡詩不必萬人傳僕不飲久矣今日過宋嗣宗且談且飲不覺霑醉年來飲酒不濡唇蘸甲今朝始為君頗似昌黎當日語人皆勸我若無聞次韻王待制遊東坡留題十一絶吞舟尺澤豈能容此地誰知著卧龍當日春風生筆底至今山色十分濃當年隨意樂江天句句新詩盡可傳事業文章兩俱美先生兼比二公賢王元之韓魏公五年同社樂田神一扇西風障庾塵文采風流千古事野人恨不識天人赤壁奴臺視白樓五言端的勝蘇州政緣不得文章力故許江山作意遊何處重尋飯顆詩先生詩語總英竒細吟出月穿天句想見揮毫落紙時對泣何曽學楚囚扁舟時作大江遊眼看西蜀三千里身在淮南第幾州前代樂天今復見後身元亮更何疑百年人物有誰在千古聲名無盡時筆下無非幼婦辭胸中端擬效安期我生只許拜遺像不見先生無恙時先生仙去幾經年赤壁依然浪接天去棹來舟相指示曽遊元祐玉堂賢雪堂風物渺江村行客悽迷欲斷魂不見當年謫仙面空餘春栁典型存腐儒詩膽大於身所恨陳言老未新何日小舟江上去一杯聊酹筆端神九日無酒仍不見菊唯巖桂一瓶伴此岑寂白衣不至酒難賖兀坐晴窗獨飲茶今日重陽對巖桂昔年百本看黃花亦好園栽菊百本每至重陽盛開次韻夔府王待制寄示巫山圖碧嶂嶙峋夔子國白雲縹眇昭君鄉平生不識巫山面今日巫山到眼傍上葉參政二絶密幄從容僅五旬趣專大政轉洪鈞熙朝未有金華相創築沙堤第一人前世萊公今復見後身文正更何疑君臣相得同魚水剩把勳名鎮四陲雨後聞蛙雨過窗虛夜氣清草間何處亂蛙鳴休論公地兼私地且聽蘿根呷呷聲次韻陳侍郎李察院瀟湘八景圖瀟湘夜雨平生雲夢澤南州秋思春情浩莫收更聽瀟湘夜深雨孤篷點滴替人愁洞庭秋月洞闊乾坤日夜浮月明天淨最宜秋何人獨卧清風裏萬頃煙波一葉舟平沙落鴈江南雲水蓼花洲中有飛鴻巧自謀過盡關山都不住直須來趁楚江秋漁村落照亂山深處水邊村小艇初歸未掩門吹火煮魚傾濁酒半規斜日照黃昏江天暮雪羣山總入玉壺中只有滄波映逺空獨釣寒江晚來雪慿誰畫我作漁翁次韻王待制初見虎牙銅柱詩千騎逺征夔子國百篇還賦杜陵詩虎牙突兀撑空出恰似雲開衡嶽時老僧擕笻竹杖來試就求之欣然舉以見贈萬里擕來自蜀州老僧珍重許誰求相逢舉贈寧無意要我雲山處處遊得伯夀兄知丞書因成絶句奉寄兩地相望千里餘一番梅雨曉晴初無因可寄平安信喜傍征人接近書讀韓詩有感用介甫體少陵無人謫仙死石鼓歌吏部文章日月光沿流館詩半世遑遑就選舉贈侯喜十年蠢蠢隨朝行和盧郎中讀樂天詩樂天古律三千首下筆當年不自休平水兒童猶誦習雞林賈客亦爭求

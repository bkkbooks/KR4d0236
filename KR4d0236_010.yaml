body:
  text: 香山集卷十宋喻良能撰七言律詩題確山梵安寺確山風物似齊山誰著精藍亂石間僧梵四時看紫翠軒窗終日對孱顔暫容借榻松風愜更欲題詩蘚壁慳老我還思十年事飛來峰上曉躋攀鑑湖道中口占軋軋籃輿鑑水濵水紋如染草如茵繁紅零落徐娘老逺翠低徊西子顰猶及殘春追勝賞不妨餘事作詩人胸中磊磈須澆洗未厭傷多酒入脣次韻王龜齡謁大禹祠酌菲飲泉不到稽山已十年夢中物色故依然憶尋絶境經幽寺曽向東風酌妙泉書穴雨餘雲撲地鑑湖春盡水連天别來喬木髙多少想見嬌鶯自在遷題東山謝安石故居江邉瀟灑東山寺知是曽經謝傅游一代英姿餘信史千年陳迹付東流暮雲初致蒼生恨逺翠如凝妓女愁好古嗟豫生苦晚停橈明月滿滄洲既游東山乘月登舟至曹娥江虞江波上一帆風天水澄明夜色空古體詩成巖影裏新醅酒酌月明中咿啞兩槳止還作欸乃數聲西復東塵滓此時無一㸃恍疑身在水晶宮題歸宗寺寺因逸少曽為宅峯自秦皇已得名不獨山南稱最古故應江左號尤清路趨絳闕山梁險奩隱金輪石鏡明誰信塵埃倦游客西風還許杖藜行次陸務觀韻題姚復之秀才適齊姚子神情處處便牀頭周易杖頭錢逢僧與語閒終日遣客歸休醉欲眠應覺此生如寄耳何妨一室且蕭然無心更覓封侯事納履誰能博一編追和陳子髙贈王法曹韻肯學少陵對馬軍肯同太白謝汪倫聊將文字飲一盞不待月影成三人門前車馬鬧遲日陌上綺羅嬌暮春想見流觴多樂事酒酣人問斗升嗔喜待制王丈歸自䕫門三年遙望瞿塘峽獨立西風首重回一騎翩翩飛詔去片帆渺渺下江來平生不願侯萬户今日重欣酒一杯聞道日邉催覲速不須歸路更徘徊次韻林參議小雪快晴著地晶瑩月在沙忍寒聊作短歌誇暖肌未辦裁駝褐露趾唯應有革鞾細㸃竹梢添爽灑偶經梅蘂映橫斜何當既積還消後剩取清泠試葉嘉大雪山隂境中寒雪飛山川明秀見應稀嚴威不貸乘興棹餘彩併入翻書帷黃竹應歌姬滿曲素花又舞謝莊衣東郊薪者寒到骨縱有狐裘那忍披送王共父西蜀東吳萬里程偶然相值兩浮萍黑頭君已登三館白髮吾方醉六經夜幌論文燈耿耿春堤把袖草青青艅艎小别須回棹不用陽關腸斷聽沿檄舟行出五雲關畫舫朱簾出曉關便風飛過幾重灣路經僧舍漁村畔身在烟霏霧靄間驚浪沸晴輸逺浦亂雲拖粉露崇山偶因王事從心賞詩語匆匆不暇刪挽周判院昔年臚唱下彤墀名壓人頭似牧之風動鱣堂昭武日化行雉徑敬亭時曽無簪筆朝端用何以修文地下為我老不堪供執紼獨將雙淚逗瑶巵次韻林明府何主簿唱酬之什向來十載願識韓一日下車許追攀美句已出黃初右清談尚餘正始間煩公筆底瀾翻水洗我胸中磊磈山更挽何郎入詩社三人俱有綵衣斑林明府擕所和詩見過次韻奉酬退之初過玉川家春徑無泥草帶沙幾㸃飛來溪柳絮一畨開盡海棠花窗間細雨青衫濕袖裏新詩醉墨斜客散酒闌還掩户可堪明月滿天涯帥參宴客於蓬萊閣林參議有詩次韻呈府公久以嘉謀贊邇英暫分東浙慰蒼生閒擕僚吏揮金盞更遣娉婷吹玉笙霖雨千巗垂欲作孤舟野水未妨橫匪因衮繡歸黃閣還念知章在四明次韻王待制劉侍郎倡和衮衣猶未趣東歸吳㑹先傳蜀道詩急峽髙江追子美清風明月笑嚴維花圍白帝行春日香藹黃堂坐嘯時顧我迂疏堪底用強顔薪粟效支離次韻林致甫參議西園宴集西園瀟灑似蓬丘容我追隨飛蓋游一一娉婷供笑語雙雙鸂䳵對沉浮堪巗窈窕如天造洞壑清泠與目謀欲識清歡兼卜夜東山月色足淹留讀林公懿誠竹軒集次韻卷首一篇南渡詩流復數誰為虞作樂只聞䕫細看出脅穿心句想見裁雲畫月時此集自應傳異域吾生還恨不同期先唐作者誰堪並奴僕微之輩牧之次韻林參議七月七日見示新作曉雨初過溽暑收微雲淡月作新秋清風政對三休閣絶景還思八詠樓緱嶺當年乘白鶴銀河此夕渡癡牛夀觴一舉烘堂樂淨洗胸中萬斛愁次韻奉酬林明府詠梅政足亷平詩更佳鐵腸還解賦梅花律傳和靖未多葉名接水曹今幾家丹粉詎須煩巧妙清新止為寫橫斜擬擕卷軸江東去乞與詩仙作意誇時龜齡王丈在番陽偶成寓居東青城北端夏室隂隂簟色寒瓜盤那復集蠅蚋研沼似欲生波瀾竒竒怪怪石幾壑謖謖蒼蒼竹數竿枕扇衣斑自不惡時文思索愧空餐時文思索允臻其極匠院之名蓋取諸此裴園小集鄭汝諧同年有詩次韻奉酬慈恩鴈塔題名處回首端如夢寐中千里逺從當日别一樽重喜此時同飛騰我久欽公輩潦倒君當恕此翁異日尚期塵史册事功那敢廢磨礲次韻宇文舍人見貽之作不見禇公今二年重來青眼尚依然偃松篇美天猶和正殿班清人孰先今日赤墀煩暫立他年黃閣徑須遷白頭賔客無聊甚只待吹噓送上天張使君生辰緑茸紅糝細團枝天上麒麟瑞此時風度冕旒嘗見問威名草木自應知當年玉燕生燕國他日金貂侍漢墀再拜祝公何所似勝游長與赤松期讀初寮集呈王宗丞初寮文律冠中京晚嵗深嚴三折肱清處月中仍聚雪髙時風裏政摶鵬家聲不墜推王粲句法能傳有杜陵剩作詩文追漢魏非公誰不閼溪藤記六月二十日湖上所見羽客相擕六一泉炎歊立變曉凉天陳朝古檜參天瘦和靖孤墳傍竹偏却向蘇堤剝新芡更尋蕭寺聽寒蟬長吟小醉歸來晚足底清風似欲仙六月晦日同樓少府由錢塘門至上竺遂遊下中竺憩冷泉亭塗中記所歷聨輿緩步踏葱蒼十里荷香雜稻香庚暑此時無一㸃秋風明月灑長廊林間巖洞侵衣潤水際亭臺徹骨凉何處山泉落簷溜恍疑飛雨曉浪浪次韻范伯亷機宜病起見寄夫君自是穎囊錐何事翻為滄海遺造化小兒聊戲劇山林大藥豈無資得閒因病還應樂信手揮毫却有詩休歎銀杯成羽化㑹須拔劔撥年衰來詩序引有盡貨酒器以辦行計語中秋示仲文弟近指揮中秋依重陽例作假一日古來佳節是中秋今比重陽許燕游已覺氷輪無限好不須玉斧更重修三飛驚鵲紛無定一㸃閒雲净不留况有阿連同綵戲何妨呼酒互相酬次韻王宫教見貽之什家住濤江東復東渺然雲浪接晴空半生仕路﨑嶇裏十畝家山杳靄中來往未成三徑樂笑談還喜一樽同強將俚語賡妍倡曹鄶端慚齒衛風長至憶天衣舊遊寄王狀元去年連轡到朝陽紅日初添一線長八俊偶同人已羡四難俱得計真良澆腸竹葉驚深碧插鬢梅花咤淺黃是日廽時馬上簪臘梅回首只今深似夢雲山烟水正相望次韻奉酬黃泰之狀元見寄千佛經中第一人明光前殿奏雄文論心詎止稱三益識靣端能勝百聞疇昔清談如扣玉只今佳句欲凌雲髙情已出蘇州右未用清香掃地焚挽吳春卿舍人出處平生似昔賢髙風徑節凛朝端回天議論心無歉脫腕文章世所難斫鐵呌天蠻獠服調羹滿鉢里閭歡定應直筆書英躅留與千秋後代看除夕夜永燈明嵗又除依然坐冷乏氍毹平生潦倒如中散大半交游今左符未辦黃精除白髮漸驚玉水㸃銀鬚欲論舊事無人共閒把香醪細細㪺過東亭湖籃輿詰旦過東亭日出烟銷十里平翠袖舞風菰葉舉紅粧照水藕花生恨無釣艇浮深碧賴有吟毫賦曉晴歸對老人誇勝賞從今不數鑑湖清席上奉常珍重末僚情許以疏慵簉俊英已辦初筵酬物色更將餘事到詩盟貪吟不惜揮貂筆忍醉何妨釂兕觥細踏芳菲過腴潤桃蹊紅雨報新晴送陳給事帥四川四海繁華一蜀都君王謀帥意渠渠百城赤子煩摩撫一代長材獲展舒玉壘倚空充屏翰鐵衣如洗護儲胥袴鞾帕首郊迎處想見旌麾入境初禮樂詩書一世英碧油青鬢二難并慣看詞翰流三峽剩有精神驅五兵暫向坤維聊鎮撫却歸天闕致升平明年春水如天日綵鷁乘風向帝京姜春坊以詩編見貽借題雪堂圖韻作詩為謝紅顔話别浦邉秋白髮同為帝里留璧水庸庸參末坐春坊犖斚冠名流功名君且登麟閣出處吾行具釣舟餉我一編清似玉五言端的繼蘇州李大著惠示詩卷次韻首篇為謝獻之辱贈舂容卷軸新懸知蚤嵗擅詩聲千林有韻霜風徑一㸃無塵霽月清細味班香兼宋艷自慚白俗與元輕欲哦惡語賡妍倡一夜昏花對短檠史丞相生辰姓名久已覆金甌一品師臣德業優黼扆尚詢黃髮舊衮衣難伴赤松遊松筠徑節髙三事桃李濃隂遍九州蕭葉楊門端可繼只今衮衮富公侯長才蚤立太平基奧學曽為帝者師謀叶不資同列斷規存長許後人隨金魚玉帶今誰似橘緑橙黃景最宜再拜祝公千萬夀三江細酌入瑶巵洪右相生辰鳯將南呂入筒聲節近中秋協氣橫玉燕呈祥生碩德金甌覆字佐升平望同北斗泰山重操與秋霜烈日爭昨夜清臺占越分中台星帶老人明黃閣調元鬢未霜秪應書考似汾陽懇辭閶闔沙堤路暫樂蓬萊燕寢香茂烈未饒周叔虎英詞寧謝漢班揚㑹看繡衮重催起快卷三江入夀觴次韻和宗郎中中秋不飲暮烟收盡玉盤生是處同欣此夜晴雲斷三山凝紫翠星稀萬里湛虛明低臨朱箔千尋白髙並銀潢一𣲖清賴有綵衣堪醉舞殘樽深夜更重傾挽司理奉議樓公老爛為儒山澤臞半生辛苦就名譽三千白髮身無事一㸃青燈夜讀書真率杯盤如洛㑹﨑嶇巖壑似陶廬欲知老淚揮難盡灑遍霜颷更濕裾

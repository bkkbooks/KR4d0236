body:
  text: 香山集巻九宋喻良能撰七言律詩東歸無邉春意正冲融十幅歸帆到淛東照水杏花紅翦翦弄晴楊栁緑茸茸風光併入吟毫裏山色都歸醉眼中説與林間子規道丁寜不必向東風東歸見梅老大無堪鬢似銀虛名猶復玷簪紳久為碌碌趨朝士暫作棲棲去國人行李衝寒歸故里江梅偷煖報新春萬鍾於我何加益三釡新來喜及親草堂成即事二首三年留滯江之南歸來故園寢亦甘經理草堂唐寳應耘耡荒徑晉陶潛寸心自昔似南八雙鬢只今如謝三手栽楊栁既合抱木尚如此人何堪燕雀桑麻五畮匀香爐峰下磬湖濵青衫不礙兩居士白髪真成六老人兄弟五人皆二毛與老母而六也子美浣花元不惡淵明栗里總宜貧作詩飲酒真吾事回首江湖懶問津亦好園即事誰將春色到山家湖緑平堤草滿沙細刻真酥水仙蘂勻搓絳蠟海紅花芳林得日鶯還囀香徑無風蝶自斜聊與後生修故事未妨詩酒作生涯亦好園春晩再用前韻境浄山明别一家幾多垂栁裊平沙閒中牽夢一池草空裏愁人萬㸃花細雨朝朝兼暮暮淡烟整整復斜斜緑隂青子真堪畫滿意春風磬水涯經理西山同二客二弟姪輩侍太孺人游觀聨句西山仍復踞西臺叔竒石逕􅋂﨑此日開虞卿竹杖相邀七八客季直芳樽時釂兩三杯仲文瀑懸巖腹如飛雨伯宗石轉山腰若隠雷仲文敬侍慈顔供一笑興之陂陀坐穏興悠哉季直春興日日春泥妨杖藜一聲何處子規啼紅將滿地花空委緑盡前山草正萋已辦篇章書側理可無杯斚捧柔荑清明過後芳菲少桃李清隂欲滿蹊侍太夫人拜掃先塋季直弟有詩因次其韻東郊雲氣曉疎疎十里相擕霽色初林幄盡頭聞杜宇荇絲深處見王餘提壺相勸仍沽酒扶杖來觀或荷鋤不向如臯閒射雉真成一笑粲潘輿是日荆婦不同行唯奉板輿爾次韻伯夀兄中秋翫月中秋自古月華好何况浮雲掃碧天不比尋常三五夕須知瀲灔十分圓畵簷影轉猶宜飲銀漢輝斜未忍眠却憶年時今夜裏獨將醒眼對嬋娟東軒即事嘯傲東軒得此生平章物理憶淵明晴塘灔灔起萍浪夏木隂隂求友聲聊欲庶幾三不惑誰能復較四難并旋燒蟹眼烹鷹爪啜罷呼兒課二京寄程教授士廓去年同宴小重陽香霧霏霏橘半黄楚尾吳頭雙妙麗茱枝菊蘂總芬芳十分滿釂白衣酒兩袖濃擕燕寢香回首只今如夢寐暮雲烟浪正㣲茫重陽遣興秋髙身老少陵悲不獨雲飛鴈亦飛紅葉色深偏照酒黄花香重欲沾衣絶知落帽歡娛好最奈登山伴侶稀强挿茱萸修故事未妨醉眼送斜暉亦好園江梅變紅仲文季直二弟有詩因次韻蕭蕭亦好耐寒枝天與風流一段竒刻玉不惟工傲雪施朱端欲妙凝脂佳人赬頰今纔見公子酡顔頃未知便好作軒名頓有二難連璧賦清詩雪中賞横枝梅花横枝梅花最先開影着清淺無纎埃夀陽粧額依然在姑射氷肌何處來無數雪花新㸃綴幾畨霜鬢獨徘徊想見懐安官道側十里㓗白如瓊瑰懐安道中梅林綿亘十里戊子除夕追和陳簡齋除夜一首世事年來已飽更百年今夕兩分平窻間蠟炬偎人煖缾裏梅花照眼明瓦屋三間聊足喜鬢霜千丈總堪驚明朝同上西山望應有江湖春水生次韻季直弟春日雪休驚雙鬢二毛加且喜東君發物華未向林梢開嫩葉先於簷際舞飛花鼠鬚正好書春帖蟹眼偏宜試露芽便欲扁舟訪安道不堪山驛水程賖次韻和夷仲節推陪府公游北山紅蓮猶得愛青山翠木蒼蘿處處攀雲水窟中聊假日簿書叢裏暫偷閒幨帷車乗春同到燈火城門夜未闗我亦林泉曽俯仰只今雙屨又塵寰題祥符寺靈山閣一倚危欄已快哉俯㸔屛障掌中開江間碧浪循城去天外青山入座來隔岸幾聲聞鼓角傍林千簇見樓臺白雲只在孤飛處西望闗心首重廻武夷山冲佑觀前水紺色昇真洞北山笋攢羣峯不㫁四時翠萬壑長留九月寒溪上桃花引漁子雲間仙犬逐劉安平生飽識佳山水直作東南第一㸔天申節望闕口號日永凉生殿閣風需雲宴衎慶流虹明良叶徳千齡遇臣妾傾心萬國同葵影緩隨羲馭轉榴花髙映御袍紅西踰蔥嶺東遼海長屬堯封禹貢中試院次韻馬駒父見寄華髪蕭蕭知更稀回頭五十四年非花添病眼正臨巻春滿故園猶未歸止酒獨醒陶靖節寄詩相憶謝元暉若為比得新篇美西蜀江頭錦一機試院七夕過雨秋風灑客裳長廊廣厦更清凉不㸔雲際癡牛女細讀文中古戰場病骨未輕聊把酒時苦臂疼以酒服藥詩情欲適旋焚香敢辭秉燭分清夜猶記槐黄昔日忙陳知府體仁和予七夕試院詩併以龍涎數十餅為餉次韻奉酬陳每講㑹甚盛八郡經生滿鱣堂那能斗酒博西凉晩年刻意𤣥虚講蚤嵗留心翰墨場憐我無氊寒坐客分公燕寢舊清香相逢一笑寧多得歸去匆匆有底忙司户李巖詹和予廬山詩二十一篇作詩為謝東野龍鍾誇白首巖詹矍鑠事清修胷中似有九雲夢筆下倒傾三峽流和我七言清有味能令三伏凛生秋當年廬阜賞心處恨不擕公九日游題馮家洞空巖寒氣凛兢兢入户神清思亦澂似應如非聲澒洞已垂未落石崚嶒深於豳俗藏氷室險過文王避雨陵刮蘚磨崖書淡墨勝游聊復記吾曽校官㕔新栽巖桂不將官舍等逆旅故把霜根栽繞牆他日花開暎秋色何人手折惹天香丁寧䕶取森森碧想像勻排粟粟黄顧我疎慵百無取未應人錯比甘棠㕘議李郎中見和次韻奉酬頃嵗題名曲江院及肩曽許亞宮牆胷中濶貯雲夢澤筆下濃薰班馬香省直舊霑衾半白除書行見紙新黄和篇如出少陵手誰謂無心賦海棠再用前韻呈㕘議李郎中獨冷官曹有底忙經旬不得造門牆雨添垂栁絲絲碧風攪飛花片片香顧我摧頽如病顙羡公騰踏勝飛黄新詩逈出南豐右不是無香似海棠寄張君玉橘亭一别五回冬寤寐何曽置此翁二十五聲秋後㸃八千里外月明中夫君不寄平安信而我方棲簿領叢三峽江髙天共逺側身西望興何窮次韻周希稷詠芭蕉經年不接故人書開户逢渠了不殊誰運七輪風裏扇時跳千斛雨中珠退之有意吟山石摩詰無心作畵圖為愛青青無俗韻故教移植傍庭隅次韻葉省幹重九樓上言懐水落魚龍已退藏小樓蕭爽裌衣凉山雲雨過無窮態巖桂風來不斷香已分文章成白豕擬將富貴等黄粱嵇康潦倒渾無取豈復眉開一㸃黄送洪右史赴召三首胸蟠補衮五色絲筆驅波濤三峽詞上追班馬真輩行下視燕許如兒嬉拙工廢繩那足道巧匠縮手今當施前途着鞭政須急玉堂獨歩非公誰長公前日辭揆塗少公今日被鋒車路人共指拜内相天子久欲登鴻儒黄麻端擬似經訓金蓮不獨榮傳呼如聞書詔正填委北轅疾驅公勿徐月宿南斗窮何遣爬沙脚手鈍可咍一生氷清但糠粃兩鬢雪白猶塵埃逹人疑劔未免按夷途薦轂誰當推公乎行矣斷國論能忘料理忍窮枚由建寧回三山道中重陽征鞍初自富沙還亂葉殷紅㸃碧山客裏黄花驚度節鏡中白髪巧摧顔三休磴道惟頻嘆一飯茆簷得暫閒為想成均新榜帖阿奴才力勝黄間通判孫宗丞分餉温柑次馬撫幹詠橘韻作詩為謝珍果分柑不作疎李衡千顆直堪奴初嘗蔌蔌泉流齒未摘青青香滿株可是騷人憐楚樹只應仙種自蓬壺龍城當日親封殖還有霜苞似此無園中口占舂鉏野鳬疑水鄉湖隂山色仍蒼蒼西風三徑有佳致朔雪横枝多暗香長統遊戯自足樂少游贏餘非所望開林貼石興未已𤓰時逼人須趣裝聞交代將至喜而成篇三年泮水冷無氊贏得蕭蕭雪滿顛晩景不妨供綵戯他鄉安敢廢詩篇賸將杯酒澆行色速賃雙童擔近編任是身歸落鴈後鄉心先抵磬湖邉府學職事置酒九仙以餞予行玉友金朋三十三擕尊相屬向晴嵐含毫共賦黄初句揮麈仍追正始談再用清烟噴白澤更霏香霧噀黄柑俊游勝事真堪畫華髪飄蕭只自慚鉛山三月春風暖更飄滿山嫩緑正嬌嬈幾聲勸我脱破袴何處撩人婆餅焦甘旨僅能供素髪涓埃未有荅皇朝吾廬漸近亦堪喜試把白醪傾緑瓢中秋終日霧雨予還自都下宿分水嶺夜漏約七八刻月出烏飯草薦山之東徘徊窻牖間欣然把酒對之因賦長句烏飯山邉白玉團瑞光千丈溢清寒斜穿逆旅茒茨室正照先生苜蓿盤聊向青天思太白却吟飛鵲憶曹瞞今宵不擬逢明月更向尊前仔細㸔重陽詠菊年年自赴重陽約不待陶家詩句催便欲急呼歡伯賞未知誰遣白衣來紅萸有韻岳連湛素蘂無香賜望回何事杜陵嗔竹葉却教從此不須開送伯夀兄之官上虞平生藝苑筆同耕兄弟須知似友生三載方尋夜雨約六旬又作越中行舉杯不學銷魂别側耳惟聽報政聲從此西岡數登眺白雲飛處總闗情時迎侍太孺人同行賢良馬叔度和周内翰送予倅越詩見貽次韻奉酬一鳴一息幾千秋風翼端宜汗漫游筆底珠璣誰得似胷中雲夢復何求談餘正始人加勝詩比黄初語更遒西笑定應㕘儤直東游聊復伴遨頭叔度賢良再用游字韻見貽復次韻謝之夕郎分閫鎮東秋幕下揮毫秦少游一代風流今不冺百年文物尚堪求交情莫逆人誰似吟事方殷嵗又遒他日約君為伯仲三間瓦屋住東頭次韻馬叔度再用前韻見寄善奕從來數奕秋勝游今作子長游才多已覺懸河似詩妙無勞入海求畵月裁雲寧底巧奔泉抉石一何遒誰知傾盖成膠漆笑殺如新到白頭過嚴瀬寄陸守務觀翰墨場中老伏波揮毫快馬下晴坡三年睿主思獻納千里疲民賴撫摩瀟灑郡齋方在望飄揺征棹未能過擬求墨妙輝衡宇應有黄庭換白鵝齋宿净明寺小飲易安齋口占净明齋宿近初庚西蜀東吳一世英行徑九盤山犖确流泉百折玉琮琤頻飛兕斚顔俱渥細聽犀談座為傾觴詠直多幽興足未應不飲似公榮挽縣尉陳元圭平生自負氣雄豪落筆文詞湧怒濤蚤嵗賢闗幾雁塔暮年花縣未牛刀凛然風義誰能並偉甚衣冠衆所髙我欲臨風新執紼忍於繪事㸔青袍

body:
  text: 香山集卷十二宋喻良能撰五言排律桐汭東汭波吞岸西桐水見沙祠山千古盛州宅四時嘉前直三峰峻旁連大洞呀黃南清港曲織女小橋斜野店籬為户春山繭作花烏羊難入饌青果頗宜茶土人謂猪為烏羊橄欖為青果綳錦饒新筍槍旗富嫩芽靈山古佛地丹井列仙家鐵冶名猶壯金牛跡尚窪滯留三載久詩板滿煙霞試院中秋效諸進士作月湧大江流團月臨清夜平分一半秋輪侵斜漢逈色湧大江流皎皎驚飛鵲亭亭喘卧牛一川寒練靜十頃素光浮碎彩通袁渚餘輝謝庾樓翻思杜陵老岸草泊檣舟由上饒之貴溪舟中書事日月三秋杪江山萬象殊小舟浮舴艋廣信出闉闍是日由廣信門登舟草木關詩律雲煙入畫圖水清沙可數景好句難摹汀際寒鳴鴈檣端晚噪烏樵村人語靜商櫂夜燈孤冷水尋宵泊焦灘就曉餔冷水焦石皆灘名霧銷分浦溆風定少帆蒲愛日生篷背竒峯湧坐隅芙蓉多落蒂楊栁有枯株楓葉紅綃翦蘆花白雪鋪翩翩兩行鷺泛泛一雙鳬斷岸幾千尺誅茅間一區鷀巖清港急龍瀨碧濤粗鸕鷀巖黃龍灘斷己憑三老那能貴一壺酒壚勞問訊漁艇費招呼鮮鯽還堪買香醪亦任沽不妨成酩酊聊復免馳驅汭口真蕭鎮錢倉豈舊爐錢倉巖名藂篁驚外褁怪石覺中刳漸喜三吳近寧辭十里紆三吳廟名波平如瀉鏡罡密似連珠連珠灘名嘯咏知誰和欹眠只自娛市聲喧弋邑山雨鬧蓮湖弋陽有蓮湖灘擬傍桃花宿桃花臺有小寺容翻貝葉無鳥棲方艤楫鯨吼又乘桴野菊新收艷官梅未吐鬚貴溪端爽灑賤子小踟蹰王事三旬外舟程六驛逾八月二十八日離番陽十月二日回至貴溪蓋三十五日舟行凡三百六十里也更判弦月上應得綵衣趨為柴懷叔殿院題世綵堂慶積門闌久祥鍾家世醲乘驄驚創見戲綵覺重逢鮐耋頻三喜孫曾見八龍年齡開九秩孫子享千鍾奕葉今榮耀蟬聨舊素封家風追萬石眉壽擬三松畫棟侵銀漢平池浸碧峯同心木芍藥並蒂水芙蓉委曲顔常悅騫騰色愈恭㑹須陶謝手覓句細形容題東林寺江湖大蘭若廬阜一東林砌繞琮琤水門羅翠碧岑煙雲千古色松檜四時隂岸幘銷塵慮憑欄净客心殿成神運力泉出虎跑音溪在思元亮堂荒憶醉吟圖傳三笑粲閣擁五杉森貝葉應難訪經臺已莫尋僧袈何代朽佛影幾時沉晉輦黃埃久殷碑蒼蘚深不妨閒弔古誰復為沾襟香火惟蓮社傳流直至今送參議李器之人間今北海天上謫仙人雄論堪醫國新詩可泣神搖毫雲落紙揮麈坐生春藝閣登吟慣綾衾入直頻三千辭故里二載宦全閩婉畫禆南閫英名動北辰惠風吹别思細草碾征輪行矣躋華要聲猷日日新釋奠禮成上安撫大觀文十四韻巨宋中興日全閩極治年保釐須碩德鎮撫賴真賢燕寢何曾逸儒宫最所先上丁將蕆事仲月乃修䖍鉶鼎參罍洗犧尊間豆籩低昻衮繡服拜起冕旒前庭燎明如晝爐薰滃似煙嚮風人引領觀禮士填咽闔郡歡聲沸熙朝盛事傳僖公甘避路常相敢差肩宜有新詩播庸昭美化宣陋儒何幸㑹典禮獲周旋南紀非工部子美題衡山文宣王廟南紀收波瀾西河共風味中和豈子淵斐然形頌述深愧采芹篇夜宿浮石山崇福寺上方題壁窈窕尋支徑縈紆度密林岸回溪更駛峯轉塢逾深僧梵雲邉寺鐘魚竹裏音解鞍生妙興倚檻淨煩襟永夜凉颷動初秋爽氣侵巖空寒溜滴壁靜候蟲吟香篆窺孤宿燈花伴獨斟不諳塵外趣誰識此時心湖上用王茂材同年韻木落長空淨秋深爽氣多淡煙浮逺樹晶日泊平蓑小艇浮深碧孤笻曵慢坡菊花簮雪鬢桑落灔金荷妙興追潘嶽清游軼永和何當命菱角唱我醉時歌過分水嶺初出建寧界辛卯踰閩嶠淳熙出建關瀰漫第五渡自崇安至楊家莊有第一至第五渡險絶百重山近夏凉風發新晴麗景還翠烟飛縹眇好鳥語綿蠻密樹青羅幄連峯碧玉環野英紛熌熌巖溜碎潺潺小艇橫清泚飛橋截碧灣機舂流水激架廠石崖慳紫笋和泥采青梅帶葉攀未能供㫖味聊得恱慈顔取醉三杯適欹眠一餉閒自憐霜鬢白人羡綵衣斑物色揮毫裏家山隱几間狂歌聊爾耳同志儻吾刪送江充之郎中知溫州巖廊拱神聖嶽牧用才良委寄晉藩鎮飛騰漢省郎縑推非矯激綿蕝豈尋常花粲揮毫玉風生漱齒霜兒童騎截竹父老候甘棠五馬晴薰細雙旌曉月凉清香凝燕寢春草夢池塘乳哺蘇民瘼生薪束吏行謝樓山色净孤嶼海天長信美毋多戀遄歸覲建章送趙逹明太社知江州天上佳公子人間少吏師文華紳笏服名字冕旒知剸决監州日舂容栗社時未成持從槖聊復把州麾京邑期䝉福湓城望寵綏朱轓臨境土竹馬走童兒去獸同均輩蠲逋繼濬之政成遄入覲獻納日論思李渤字濬之為九江守奏放逃逋四千餘貫東宫生辰寶厯天重啓皇圖日寖昌九重資燕翼萬國仰元良玉律秋初杪金飈歲正穰前星輝采盛少海慶源長甲觀祥煙滃春宫協氣翔千秋佳節勝四莢瑞蓂芳瓜棗欣初獻蟠桃慶乍嘗庭羅六佾舞天薦九霞觴銀榜彌生耀銅扉粲有光歡聲連紫極喜氣溢穹蒼冊錫雕珉焕旗頒青輅揚衣惟珍黻冕音不嗜宫商問寢同周發隆師過漢莊猷為規禹啓翰墨掩鍾王化被賓詹屬恩沾左右坊善三今獨冠明兩古難方陸贄言猶采宣尼訓敢忘本支綿百世羽翼二巖廊宿忝宫僚舊曽霑兊澤滂願斟滄海酒歲祝壽無疆留别王狀元二十四韻才大文章伯忠純社稷臣七州鍾秀異孤嶼賦精神德藴圭璋潤胸涵海嶽春麟經頻得雋槐市早稱珍宿弊時方革皇綱上正親大廷清問降空臆讜言陳力補嚴宸衮深攖睿主鱗一元追董相多詐恥平津文擅無雙價臚傳第一人聲華飛宇宙風采聳簮紳貴紙寧堪數回天僅足倫施行均令甲奬諭見絲綸未覆金甌墨聊為緑水賔愛民如赤子束吏似生薪鑑水書題遍稽山賦詠頻却梅清節著見幕府清風不受梅詩誣狗滯寃伸見論魯六傷犬劄子賤子嗟何幸同年蓋宿因糟糠聊攝局山水獲聨茵醇酎容霑醉新詩許效顰獨䝉青眼舊端異白頭新酬倡幾千首從遊殆十旬笑談將契濶肝膽政輪囷帝夢方思說天民竚起莘不才雖苦窳終始願陶鈞六言詩亦好園羣花盛開戲成小圃初乾曉雨雜花爭試新粧揉色似觀濯錦吹香如過河陽三歲無諸國裏青春不是花時今日小園春半百般紅紫芳菲福唐桃李臘中皆開紫笑茉莉五月始盛題李通判斷橋圖平生心地夷坦一旦足跟嶮巇不是籃輿安穩只應神物護持橋上笋輿岌岌橋下浪波沄沄但覺往來無惱不知觀者傷神書趙德莊詞後老眼看書成霧介菴墨妙金篦波底斜陽紅濕絶勝彩筆新題訪何茂恭於南湖作三絶句十里相望烟樹旬月不絶籃輿潄石枕流戲綵浮家泛宅南湖南湖緑髮居士恰少磬湖八年掀雷抉電傑句出月穿天大篇啼飢妻子眼底厚祿故人日邉一錢不直誰念五十無聞自憐茂恭見和再用前韻奉酬朗朗百間羊肸森森千丈長輿一身宜著臺閣半生流落江湖憶昔永新番水俱吏江左三年不作載苡馬援聊為留犢苗篇少陵時時醉裏子山日日愁邉白髮新來滿鏡故人萬一能憐磬湖居士得片石于斗坡山其長五尺其廣一尺有咫聳拔孤秀縝密溫潤絶不類此間石疑自他山飛來因目之曰飛來石六丁驅石日本墮落斗坡山中一片蒼圭紫玊幾回秋雨春風不假鐫鑱刻削自然巧妙嵌空居士置之朝爽是謂飛來小峯五言絶句題齊山翠微亭山深雲氣多撥雲尋徑入但覺襟袖寒不知濃翠濕賦竹冥搜高出月幽思渺裁雲擬遣窮愁去那能無此君海棠塢晴塢夕陽媚暖梢春意留詎須吞絳蘂方解解人愁七峯亭獨坐嶼岫新亭好悠然見七峯憑欄吟不盡春色與秋容水樂洞近聽千絲急遙聞一磬清恐傷詩肺腑不作斷腸聲曲水不是山隂畫清流曲更方欲知三面景絶勝九回腸方池四角朱弦直雙橋小霓欹寒星夜稀密冷浸一枰碁弄月亭掬水弄漣漪清輝碎更隨人間無太白欲捉可憑誰紫君林此君仍佩紫直節自來孤欲倩文夫子招邀入畫圖小山峯秀因拳石溪清見髮魚陶隱居注本草云䱉魚是人髮所化毫釐辨喬梓咫尺有匡廬石洞此祕昔未覩斫雲今始開蒼松臨怪石宜號小飛來竹巖怪石誰雕斫蒼蘿翠木斜幽巖畫屏倚却憶栁州誇石塘野色知何處松邉竹外塘雨餘紅菡淨風起白蘋香飲茶清風生兩腋雪乳啜雲團便擬乘風去翻嫌縛小官懷東嘉先生因誦老坡今誰主文字公合把旌旄作十小詩奉寄文章無正體源浚流乃深能者主宰之古來非獨今大雅久不作淳風日澆漓挽回既狂瀾此道非公誰三賦成㑹稽四集始東楚一洗凡馬空斯文有宗主對䇿婉而切奏疏忠且純風行水自波至哉天下文退之在元和昌言主文字揚鑣踵芳塵公乎得無意作詩必坡老作文必歐公欲知鳴道心端與二公同直道蓋中朝雄名橫六合吾道其非邪胡為未舟楫三讓始循墻一麾嘗屢把䕫門德政碑深鑱仍大寫不見我公久搖搖動心旌敢以一瓣香為公罄精誠蘇公亦有言公合把旌旄庶使湛輩名亦與峴山高曝書秋陽千里曬聊復曝吾書自笑年來事昏眸眩魯魚池邉樹磔索池邉樹踈花照淺清雖無却月觀且有一枝橫汲水山泉盈石坎抱罋每相從不敢傷蝌蚪疑能化小龍賞月雲盡天容靜冰輪故故圓廣寒宫闕裏今夕是何年奕棊睡餘無俗役信手一枰間勝負何須較神情政欲閒掃室凝塵晝滿室燕處亦超然掃罷掩關卧從嘲邉孝先澆花花木蒙霑潤根堅枝亦驕懸知如舌本端藉酒杯澆採菊采采黃金蘂盈盈白玉觴露蘭何足飲自覺肺肝香䇿杖田園依峻嶺牽興每須登却得臺郎力扶持借赤藤題徑山一覽亭歷覽衆峯頂下視飛鳥背一身凌紫霞逈出塵寰外題錢清江不受百錢餽從兹號錢清至今千載後猶得仰佳名亦好園初春次韻梅開羣玉府栁試縷金衣過臘山逾瘦迎風水漸肥初日宜征轡輕寒怯夾衣蟹黃經雨潤鴨緑得春肥讀書一飽無餘事平生萬卷書短檠頭雪白端為惜居諸覽鏡平生壯夫志老去未消磨其奈青銅裏蕭蕭雙鬢何次王狀元晚菊二絶雖晚亦既好花中無此香誰能識真趣高隱在潯陽併與杞同賦舊嘗聞雪堂先生淡無欲亦復愛清香彥禮提宫寄似黃芙蓉詩次韻奉酬二絶紅粉雖云妙鵝黃亦大竒欲知堪畫處絶勝採江時幽圃知何處青山東復東芙蓉黃玉蘂還與海榴同惠山黃芙蓉錦園黃石榴風味略相似亦好園四詠亦好亭亦好新亭小登臨意緒長清流依檻曲明月逐簷方磬湖未用他山錯寧須泗水浮衝風時激浪清韻亂鳴球釣磯只為貪赬鯉還應愛碧流風來花落餌雲破月沈鉤菊徑小徑三秋好西風百本黃但令頻泛酒日日是重陽黃石榴吾里所未有僕始携自中都植之二年方著花明潔可愛異於他榴但見蹙紅巾未聞衣黃裏一試縷金裳世職真西子細染麴塵英稀著鵝黃蘂雖無蠟梅香風味絶相似磬湖即事十畝煙波濶平開一畫圖已添無數景喚作小西湖題亦好亭集句從士力難任退之何其掛懷抱子美不及在家貧樂天客中守歲在家貧亦好戎昱園中即事二絶錦園無十畝緩步足登臨弄月波濤細愛山花木深風徑木初落霜輕花更幽晴香山苦馬冷豔水牽牛有花生曲水中似牽牛而小葉生水下花出水上其幹類鵝翎箭桿仍長一尺四五寸無枝余為名之曰水牽牛愛山堂棟宇還依石窗扉不礙山丹青寧辦此烟雨飽孱顔

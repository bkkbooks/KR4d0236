body:
  text: 香山集卷八宋喻良能撰七言律詩春水磬湖春水夜來生曉起雷聲逗雨聲去馬來牛心莫辨鸕鷀鸂鶒眼俱明飄零花片有底急搖曳栁絲如許輕旬月煙村半風雨榆錢好為買春晴次韻送季直弟入越積雨新晴耳目醒長階栁色靜間庭已看桃萼胭脂濕未有楊花雪片零客路汝應懷稚子家居吾亦念樵青須知兩地無百里不用陽關腸斷聽一室隂陽一室冷兢兢燕坐何曽病鬱蒸只擬綸巾持羽扇未須赤腳踏層氷滿盤碧玉初投箸一榻清風更曲肱掃地焚香涼到骨疏簾何處欲揮蠅記夢小窗幽閣睡初勻夢到鈞天侍紫宸盤號搯桃真異器果名黃棗豈常珍殊恩併浹鴒原弟美味初嘗鶴髮親願竭精忠圖報稱覺來肝膽已輪囷次韻伯夀兄宿華藏有感水淨溪空峰更青目雖未到已先明棟浮萬縷晴雲細軒擁千重夏木清幽興入門應自適殘樽下馬與誰傾老僧齋罷唯須睡不信人間有月評曉霽夜來細雨暗冥冥曉起秋容入畫屛水色淨涵天影碧林梢微露逺峰青嫩黃稼卧衡從畝老翠栁拖長短亭一晌西風醒睡眼端如痛飲讀騷經題繡川驛揖秀亭次張明府韻一色蒼波百頃煙直楣橫檻覆華椽從來好景無今日何限清詩似昔賢把盞有山來酒面憑欄無路到愁邊我來政值雨新足芳草芊芊緑滿川次韻趙禹平春日書懷草色青青二月時物華雖是我廬非日明院宇燕相語花發園林鶯亂飛無數小桃初掩映幾多垂栁自因依春風十里歸吟筆未用羅幃繡幕圍八月十四日亦好亭遲月不至分韻得秋字亦好登臨似庾樓是中風月最宜秋素娥欲赴經年約行雨潛分一段愁聊復飛觴追勝賞何妨秉燭事清遊明年此夕看明月千里相思楚水頭次韻衛知機秀才梅花東君調護亦多情瘦比夷齊徹骨清有韻緑毛時倒挂無塵白鷺可同盟未應桃葉能稱姊若齒山樊定是兄何事故園頻入夢疏枝新賞玉溪晴桐川有玉溪梅郡中施之圖畫謝張使君惠簟瘦玉敲風翠幹長織成漪浪瑩滄浪封題尚帶鄱江潤卷贈猶餘燕寢香竹笛當年同秀質桃笙何處避寒光微軀詎足當珍賜持奉親闈枕扇涼送張使君桐川風物最三吳刺史循良繼兩都但見賣刀還買犢誰知有袴本無襦來時竹馬迎兒輩去日棠隂繞舍隅攀斷車轅留不止他年應作祖張圖寄題梅山平生滿耳説梅山十里荷花繚繞間宫女三千顔綽約繡衣十萬綵斕斑瀕江景好圖難盡飛鷺詩工語莫刪定約後期窮勝賞不辭和月棹船還寧川平生滿耳説宣城入境雲煙照眼明過雨偏濃千嶂碧未秋先冷數溪清細看菡蓞波間色時聽綿蠻竹裏聲不是多才謝公子江山猶解發吟情再用前韻晚驅羸馬背重城曉度層巒淡月明醉與别愁相喚醒秋兼詩思一齊清舞風繁蓼堤邊影泣露寒蛩草際聲欲駐征鞍聊小憩敢將王事徇私情秋浦試院奉和馬駒父見寄也知融帳多餘暇欲往論文偶未遑棄置亡何投轄飲經營俱下讀書行子雲但覺玄猶白元亮應欣菊已黃辱贈清詩不知報剩親燈火趁新涼由當塗回宿齊山用杜牧之韻一望雲煙興欲飛晴光聊復步熹微幾年想像空懷古今日登臨自送歸寒菊有花宜靖節澄江如練憶元暉夜深靜坐清人骨巖影侵階月滿衣九日青陽道中呈張主簿重陽時候在青陽野店山肴對舉觴菊蘂半開簪鬢好橘包初破噀人香西風有意吹紗帽細雨無情濕錦障但得一樽相對飲不須更問是他鄉謁太平興國宫平生耳滿太平名今日身親謁太平道子畫圖形未泯廬君山水眼初明雨餘翠滴千峰色秋半寒生萬壑聲扣石當年開洞府儻容凡骨到蓬瀛觀門之左有劉越石乃康俗遇仙處也八月十五日夜試院玩月呈葉判官徐教授蔡主簿西風細逐桂枝生秋月圓從屋角明歡伯向人端有意素娥於客亦多情試吟飛鵲南枝句更聽春蠶食葉聲從此塗山添勝事四翁相遇四難并亦好園梅花一别經年見未曾衝寒相值意凌兢肌膚姑射仙人雪品格中山孺子氷清淺池塘春未動黃昏籬落月初稜從來自倚心如鐵被惱如今似少陵次韻茂恭元日大雪逗曉褰幃著綵衣忽驚庭户有光輝緩將柏葉隨觴舉細看梅花伴雪飛阿堵無心來潤屋詩仙有句到柴扉酒酣笑共兒曹説去嵗如今歸未歸豫去嵗元日猶攝邑婺源未還侍傍也栁季修知丞以詩見貽次韻為謝古木隂隂繞屋廬官居端的似田居詩清子厚龍城句字瘦誠懸殿壁書那復有心追四至只應無事富三餘一樽間論金罍事為笑紛紛竭澤漁仲修嘗與豫論及前此縣僚以為笑送交代李丞元舉藍田松下日棲遲不比韓公作記時鷁首千行攀别淚牛腰幾軸送行詩我無楚尾歌來暮君有齊民頌去思自是中年多作惡可堪煙雨話分離春盡偶書溪流如帶碧縈紆滿地間花雜野蔬濃淡柘隂三月暮淺深山色晚晴初頗驚井落家徒壁却喜盤飱食有魚蜀魄健啼春又老揮鞭吾亦憶吾廬題顔范祠堂聖宋神唐兩巨人髙風徑節許誰倫闉闍自昔宜雙廟輪奐于今始一新破敵威名優魏國偃藩功業過張巡後先來作江城守俱障西風避庾塵宴餞逢寺丞口號一扇清風自楚臺公堂蔥鬱玳筵開旌幢映座千峰日鼓吹喧天萬壑雷秋水幾行揮玉箸春蔥千指送金杯甘棠不獨留遺愛會見翻為調鼎梅捕盜至栗洪嶺下道人庵滯留數日遣興亂山深處小溪隈夏木隂隂水半回風岸欹斜對青竹雨枝低重弄黃梅濃愁難辦新詩語吉耗聊傾濁酒杯戲綵老人須強飯玉鈎才吐即歸來題開先寺少年魂夢到廬山今日親遊鬢已斑聊復揮毫吟紫翠未妨拄頰對孱顔遙看飛瀑三千丈近去青天咫尺間不為白雲頻屬念應遊此地不知還壯觀端宜冠九州未應萬壑敢爭流盡將銀漢為懸瀑一洗紅塵變凛秋白雨廉纎飛逈野玉龍夭矯下靈湫廬山處處雖竒絶不到開先未是遊鵝湖寺在鉛山縣舊名仁夀院以鵝湖山得名長松夾道搖蒼煙十里絶如靈隱前不見素鵝青嶂裏空餘碧水白雲邊氛埃斗脫三千界瀟灑疑通十九泉五月人間正炎熱清涼一覺北窗眠水鳥飛來一問津璧宫珠塔便紅塵開基古佛留遺像直日竒峰列衆賔芋火擁殘知永夜霜鐘遞起嚮初晨川徒渺渺驅塵駕回首林前愧野人遊西源于白雲峰下煙霏霧靄間逢一女子縞裙翠袂玉雪可念同遊十有二人遂共酌酒于大石屏季直弟有詩因用其韻相攜攝履響層巒翠蔓蒼蘿著處攀身在天台秋色裏路經巫峽暮雲間欲飛還住一仙子似淡如濃雙逺山笑盡一樽無處覔斷腸霧鬢與風鬟西禪寺修廊千柱壓城隂山並廬山勝二林六月簷楹無暑氣四時山水有清音鳥飛不盡上方逺鯨吼希聞别院深更欲題詩發佳境泮林講説總關心豫卧病數日意思殊昏昏中秋強起陪老人把酒對月不敢濡唇吻思去嵗在當塗試院與諸公飲酒賦詩又一載矣因成長句楚水塗山各一涯今年還是去年時古來明月皆如此我試停杯一問之丹桂飄香知有子飛烏繞樹似無枝直須看到冰輪昃忍負姮娥隔嵗期次韻戲綵老人重陽懷故園作瀟灑秋容雨後天丹青端似倩龍眠故園緑竹應今日異縣黃花又一年微祿秖堪供菽水菲材安敢擬淵騫日來王事欣多暇聊向樽前一粲然送閻紫微歸蜀曲江分袂十年中一笑相逢楚水東西掖判花知思湧南墻哦竹坐詩窮秋風但覺艅艎駛晝繡何妨畫戟雄道過夔門王內史為言雙鬢已如蓬寄周彥禮知丞樓文舉司理從容里閈待時須二老風流孰與俱遷善節香如故否望雲迎月更佳無醲寒凛凛侵衣袂薄雪斑斑入畫圖欲把一杯論舊事五年魂夢隔江湖次韻伯夀兄見寄江國疏梅吐玉英故園想見木欣榮二年鴻鴈碧雲闊千里江湖春水生冉冉池塘應入夢瀟瀟風雨若為情行看戲綵青萱發凖擬芳樽相對傾二月十五日陪府公出郊勸農雨過郊原草色勻元戎小隊出城闉聊穿阡陌溝塍路遍勸鋤耰襏襫人紅杏梢頭春意好緑楊深處鳥聲新此行端為劭農設肯學醺酣吐錦茵陪曹使君牧馬寺勸農朱轓小隊出郊坰風捲濃隂作快晴夾道老人迎五馬囀枝黃鳥避雙旌參差麥壠雲屯重零亂梅花雪片輕勸課定知非小補扶犁擕餉趂春耕次韻木藴之狀元見寄之作水繞星山木繞廬江城孤絶政愁豫鳥言為吏居篁竹烏鬼得魚歡里閭照眼梅花寒皎皎關心煙雨晚疏疏真山多謝遙相憶長句新詩細字書登五峰亭望廬山平生廬阜去無因咫尺于今不得親顧我塵勞四十九羡他蕭散二仙人太白四十九遊廬山東坡四十九遊廬山豫今四十九矣會當拄頰看山色更欲題詩滿澗濵為報草堂蓮社友掃雲開户待遊輪詠月何年玉斧巧修成半似明生半魄生易使飛烏來匝繞難將老蚌較虧盈吳都賦蚌蛤珠胎與月虧全桂枝不逐秋風老水影長隨夜氣清曾是廣寒宫裏客舊遊重訪更含情陪通守李丈出郊出郭旌旗及曉晴朔風凛凛水泠泠堵墻野老瞻泥軾冠劍長松拂屛星破臘梅花強半白先春草色未多青經行肯為遊觀美王事馳驅不敢寧曉行霜重如雪霜重寒威一夜加曉來人迹板橋斜已看白鴈來千里想見青州滿百花何處菊枝猶復耐故園菊味定堪嘉慈顔正念征裘薄歸去萱堂笑語譁挽施州使君鍾公弱冠為儒世所推中年事業更瓌竒才名屢致諸公薦讜論深蒙睿主知郡政堅強同薤水行囊蕭瑟似琴龜只今惟有清江路父老相逢説去思

body:
  text: 香山集卷三宋喻良能撰七言古詩次韻伯夀兄海棠無情長笑杜陵老不識海棠春意好東坡作意賞東風為愛輕綃映肉紅枝頭㸃綴知多少貪睡今年開不早含情欲開還未開紫蝶黃蜂亦懶回可憐熟視明人目長恨年年看不足曉來風定雨霏霏減却春光一片飛多愁更被花相惱寧惜春衫同藉草潘淑妃東昏當日寵容華潘妃步步生蓮花閲武堂前種楊栁玉兒雪腕親沽酒蓮花不見楊栁空蒼烟白露雜悲風張麗華張家女兒號麗華十嵗選入君王家君王一見念玉雪喚作後庭瓊樹花臨風結綺香風度自謂朝朝兼暮暮那知夢斷金井欄往事茫茫墮煙霧廣信試院追和東坡催試官考校韻深院鎖涼秋西風坐間好几淨窗明塵不飛似躡紅雲至三島數枝淡淡桂新香千帶垂垂栁初老此邦天下秀多士鄒魯無負薪或解談王道被褐無非懷璧夫五兵奪目庫觀武大嚼快意門過屠誰言拔才古難必披沙求金要須得回思褁飯然脂燭一心敢擬思鴻鵠吉老手刃凶人為母報仇詩以紀之卧氷叱馭全忠孝王氏多賢今古同公乎孝行驚創見落落豈特漢晉風凶人夜半發丘隴敢爾殘暴不畏公古來刃讐不共天痛貫肝膂何時窮刳心設祭久自許何况臨機敢不武拔刀斷賊血糢糊袍笏雍容詣官府忍恥貪生真可羞退之諄諄言復讐請衣一擊當報怨豫子猶能致嘉傳如公壯志今已伸他日定為忠義臣行看氣節動天子詔書一洗泉下恥木狀元惠示近詩一卷作詩為謝洪都通守詞華溢漢殿文章元第一萬卷落落蟠胸中三江衮衮懸吟筆贈我玉佩聨玦環未數大鵬兼小山欲知風味不能盡此卷長留天地間向伯章通判請賦畫扇晴天萬頃浮烟水小艇鳴榔烟水裏一聲欸乃西風起滿輪明月蓼花秋富貴於我真浮漚世間何事不悠悠為周提宫題尚友堂先生髙節作流俗未應名宦能羈束歸來卜築傍泉石灑落軒楹照山谷外羅君子六千人中有插架三萬軸我嘗一日坐其間至今清興猶堪掬題晚節香亭周侯人中英為文若翻水苦節凌雪霜香名馥蘭芷考槃在幽谷篁竹富清美竹邊兩桂樹碧葉光薿薿扁堂曰節香欲以規業履竹桂日以茂業履日以修一觴一詠知未稱願續離騷賦逺遊離騷經曰依前聖以節中又曰雜申椒與菌桂逺遊曰舒并節以馳鶩又曰麗桂樹之冬榮丫頭巖自有宇宙有此山萬八千嵗須臾間亭亭造天屹石壁雨淋日爍逾堅頑且無泉瀑美裙帨肯以草木媚容顔丫頭得名良未稱那有巨手梳髻鬟㑹當呼作陸砥柱長與羲娥閲往還侍御宴僚屬于番江樓以卧病不克與分韻得四字使君自是廊廟器五馬一麾聊爾耳今年清淨獄既空去嵗豐登米不貴郡中九賢政可十京兆三王何足四乘閒領客宴江閣對景題詩忘肉味坐間僚屬總文采筆下波瀾更源委夏木隂隂啼鳥喧烟波渺渺輕帆駛錯落觥籌略逹尊從容笑語窮幽意嗟豫薄命捩翻羮卧病空齊吟擁鼻畫㦸凝香不同賦白衣送酒猶霑醉追攀逸韻苦無才想像清歡欲生翅蘭亭被罰定非佳金谷望塵吁可愧他年江左仰遺風應有畫圖傳盛事題楞伽寺李公山房藏書閣小閣峥嶸在空谷云是先生讀書屋不見善和數千卷空聞鄴侯三萬軸先生一去幾經年山色依然為誰緑只今賴有衛夫人壁上蕭蕭數竿竹春晚遣興乳鴨池塘春水滿秋千院落東風暖簾間燕子語雖忙葉底黃鸝啼更緩長大何如年少時雕鞍駿馬踏芳菲閉門不覺庭花落顛倒殘紅作地衣次韻王侍郎寄題亦好園磬湖鷗鷺自相親湖邊山園步步新魚鳥細看自足樂芋栗可收猶未貧我覺有園貧亦好人笑此園何太小他年便擬當菟裘不羡蓴鱸歸計早種菊子猷借宅亦種竹淵明荒徑猶存菊九日黃英凜碎金三冬翠幹森寒玉亦好才圍一畝寬恨無九畹養芳蘭聊種寒花一百本要伴此君秋後看僕坐釣磯季野弟寄詩來因次韻湖岸栁根半欹側栁邊仍有陂陀石不因斧鑿成漁磯燕坐未妨鈎餌垂磬湖寧待他山錯白波分影涵翠幄翠幄隂中千結藤對面好山羅畫屏遙岑無雲明入眼遣我爛如巖下電平生不憂臭於銅俗氛安能蔽重重興來散䇿飢來食起居無時惟其適詩窮吾師杜少陵一杯未用身後名他年掛冠不待老歸來從君乞身早新居成茂恭以詩見賀次韻奉酬子美堂工始上元斷手乃在寶應年顧我無能為杜役有此屋廬差不難欲移修竹梅花亞暮靄朝烟迷上下室逺地偏來者誰時有相思稽老駕平生願足不願餘底用虛名更著書雖無拄腹五千卷且有山陽宅一區海內長句君最好辱致新篇為善禱雞豚社酒幸不逺來往他年成二老蚊慢膚秋來困撲緣手不勝拍身聽旃昨夜獰颷愜人意一掃天宇何澄鮮蚊子蚊孫與蚋伯飛鳴適意須明年題葉省幹見示詩卷次韻一篇微官詎足施才具每向閒中有佳句要同秦系下長城却笑屈原無聖處穿天出月摘清芬煎膠續絃唯有君命題探韻儕輩分昻昻野鶴在雞羣緑髮才名今白首未數憑虛與烏有㑹當載酒擘鸞箋共試吟邊三昧手葉少有閒傍蒼苔數落花之句為汪彥章所稱謝君植矮梅百許株蟠屈如輪臘至皆著花灑灑可愛孤竹低回首陽下許由偃蹇箕山巔謝君雅有林泉趣種得江梅如二賢南州臘月溫和早賴有氷花除熱惱鱗差百樹夾徑明似過山隂雪中道試院一首南國諸侯老賓客霜葉青衫頭雪白繡衣使者急搜賢又向文場三捧檄全閩多士如鄧林大厦度材慚匠石細看太白日萬言時取武成二三策清心期識璞三獻過眼敢迷目五色只今雖無衣鉢傳向來未省原天覓更長寧辭燭屢秉漏下何啻夜十刻回思前日踏槐花忍使青袍輕飲墨余同年由試院積俸給買馬而歸中路幾逸戲作長句贈之知君幾作東野畢瘦馬田間風欲逸圉人白汗似翻珠暫爾奔騰未為失歸家須辦紫游韁玉轡紅纓搖鬧裝一鞭嘶風映垂楊要試寧川春草長安撫開府史丞相誕辰一年好處橘初緑雨後秋容淨如沐潭潭大府忠孝家黃堂正奏千秋曲揮毫落紙妙卿雲千佛經中蚤致身橫飛直上九萬里金魚玉帶真天人籌邊利國知誰似直節長才堪重寄手扶杲日照乾坤力轉洪鈞陶品彚櫜兜㦸纛粲煌煌紫極聫休衮繡光暫向閩都分帥閫再歸天闕致時康鯫生才業等襪線昔辱甄收今論薦喜看太白應長庚樂頌燕公符玉燕舊聞莊叟說大椿八千為秋八千春願將眉夀同長久永作王家柱石臣參議李郎中惠示古律詩兩巨軸次韻首篇奉酬鄴中七雄迹既掃謝樓夢斷池塘草仙李詩人麻竹多佳句唯傳杜陵老省郎句法専後來壓盡今世詩流才并刀翦水有佳致月中聚雪無纎埃穿天出月餘四紀來詩有宣和中作故云捉月風流今不死從教人售一杯水自信筆挾風霜字次山風味喚仍回老文猶未磨蒼崖收拾明珠百餘斛寒光入夜闔復開我得公詩興嘆慨千古長留詩卷在秪恐天官下取將人間古貨今難賣八月十五夜玩月前年磬湖新雨歇獨繞湖邊待明月夜深雲散月華來疑是山隂踏晴雪去年鎖宿校羣英氷娥於人亦有情仰看一鏡緣雲上俯聽春蠶食葉聲今年廣文在官舍亦復開樽臨月榭慈顔一笑綵衣輕誰云官冷孤清夜酒闌月色更徘徊捲簾開户真佳哉懸知明年應更好扁舟正泊雙溪隈豫由中都還至暨陽道中聞禽鳴云明朝早起插田作詩識之溝塍雨新足䆉稏秧正緑林間鳥聲喧明朝起插田明朝插田起須蚤謝汝殷勤勸畦稻禽聲禽聲亦不惡大勝人歌金縷曲送劉孟冶司令之官四明先生行孝人莫攀平生急祿怡親顔三千曲禮髮已白七十老萊衣尚斑秋容新沐江涵天潘輿低昻御花間憑誰為喚吳道子一寫畫圖連越山若耶曲若耶溪上凉如許五月清風不知暑半空濃翠接蒼烟滿眼輕隂覺疏雨織女潭邊深復深繞門山畔石成林紅粧蕩槳誰家女笑入荷花無處尋㸃檢朝陵內人頓遞至西興道中紀事平湖㶑灧搖春風扁舟輕駛如飛鴻垂楊萬縷長青茸倚岸崇桃醉臉紅滿空烟雨霏濛濛柯橋精廬聞午鐘平疇麥苖青芃芃崇峯秀岑紛玲瓏圖經未看名叵窮雨烟葉交朦朧吾欲圖之誰其功妙語却思六一翁解道山色有無中薄暮艤舟依竹叢夜深㸃滴聽孤篷天明利涉浮梁雄錢清雖小炊烟重我生之辰今適逢一杯不暇緣匆匆聊以新詩娛老悰龕山西北水溶溶白鶴橋邊小梵宫海天茫茫空復空放眸一望日本東蕭山小邑河陽同桃李漫山如錦幪溪旁驛亭名夢筆故居知是江文通西興浦口天連水滿眼長安紫翠濃四月二十九日坐直廬讀山谷效東坡作薄薄酒二章慨然有感追賦一首薄薄酒勝獨醒醜醜婦勝鰥煢笙歌鼎沸不須羡松風滿耳自足聽前遮後擁未必樂邀月對影堪娛情晚食有味可當肉衡宇無災勝列屋魯東門外聽鐘鼓齊宣堂下狀觳􅑌何如巢林一枝飲河滿腹水磑多至三十具胡椒滿貯八百斛何如濁酒一杯彈琴一曲子平為富不如貧子方稱賤能驕人髙明之家鬼可瞰網射納稅官不嗔中山醇醪醉千日文君逺山致消渴不如茒柴百錢可一斗荆叉白頭長相守次韻王侍制讀東坡詩兼述韓歐之美一首文章端與時髙下列國有風周有雅建安氣質混不傷齊梁紛紛堪斗量先唐詩人子韓子落筆洗空千古士篇章杼軸自己出正𣲖猶能傳六一作詩餘事真詩仙騎麟被髮何翩然韻寬泛押入傍近窄韻宜搜期押盡鈎章棘句未多郊古諷新題寧數稹五季詩流喜穿鑿蟬噪蛙鳴嗟衆作皇朝天人歐與蘇星鳳初見人驚呼醉翁句法到勝處紆餘條暢今古無鋪張揚厲詞藻掞雅稱金泥兼玉檢一篇妙絶廬山髙幾首清新寫鬱陶造化機緘富狀彚豈獨文星南斗避如何妄評味短長自古羣兒喜嘲議雪堂羈窮如牧之得非天欲昌其詩平生古律三千首無愧清風白雪詞才如太白更無敵文似子長兼愛竒江西宗𣲖不足進自鄶以下曾無譏流傳海內皆珠玉到處逢人俱願學不須酬唱說西崑宋有歐蘇唐有韓二文謂文公文忠也邈乎其杖几一編且誦蘇夫子古風一首奉送淳叟太博通守豫章劉侯精神秋隼緊髙論懸河傾不盡至尊動色嗟諤諤權幸切齒畏謇謇致君未覺賈誼疏濟時尚嫌馬周窘三年博士向見治萬卷蟠胸一何敏歘然大起故鄉思自請題輿佐旟隼笑指江城欲載馳輕棄班列誰能挽羡君去騎日駸駸顧我朝行猶蠢蠢語離寧憚十觴連惜别不知雙淚隕贈言見意乏珠玉作詩餞行少鉛粉從今數日待君歸握手修門未為晚都丞李侍郎叔永和豫小園二十六詩因成古風一首奉謝黃昏兀坐對疏竹歘有寒光臨蔀屋焚香發軸得新詩炯炯驪珠二十六三唐妙音久已斷輞川麗藻今能續報瓜何必枉瓊華抵鵲奚須費明玉韓豪蘇仙吁可畏白俗元輕何足録從此磬湖三畝園絶勝李願一盤谷都丞侍郎再和屋字韻詩次韻奉酬小園五畝依篁竹中有茒茨數椽屋小橋度水既窈窕側徑穿花仍曲六慣看翠碧羽差池時聽黃鸝聲斷續詩成持鼓過雷門誰信拋磚能引玉長篇麗句為藩飾小草么花䝉著録懸知家世以詩鳴壓倒平泉與昌谷李侍郎三和屋字詩次韻為謝衛武文章比淇竹閉閣著書欣仰屋胸蟠載籍餘萬卷為家五百九十六詞華爾雅騷可奴議論淵源經可續筆端凜凜挾風霜齒頰泠泠潄氷玉久知廣大端可法自顧么微何足録願同湛輩附羊公庶比江西𣲖山谷何司業和屋字詩見詒次韻奉酬亦好園林富松竹愛山堂上書連屋恨無妙語為題品空對竒峯有十六先生佳句落泉石杜詩韓筆端能續有如妙響發朱絃恰似清音動寒玉須知小圃辱提撕何異寒門被收録從今草木有光輝盎盎春溫入鄒谷寄湖口劉少魏主簿求皂湖石平生愛石似竒章老矣一拳猶未致夜來夢繞太湖側萬玉嶙峋清有味夢回身復落紅塵聞道皂湖山可人幸致一峯為我夀為君作詩傳不朽伯琬明府年兄和豫致字韻詩舉英石見遺謹次來韻以報盛貺久聞英石空流涎意欲得之無力致士衡東頭富玲瓏染指獨許嘗鼎味明窗淨几拂蛛塵尤物定自能移人報惠慚無百金夀贈公相好無時朽公家一峯如終南須信是中有佳致對之忘飢亦忘愁豈待聲色兼臭味嗜好蕭然逈出塵同年要是我輩人世間何物如石夀墨妙與之俱不朽周希稷見示詩卷作詩為謝周郎列宿胸中羅筆端有口如懸河贈我明珠六十八一一照乘圓無頗我學穀梁失也短君才士衡患其多中興功業要紀述浯溪石崖當往磨次韻楊廷秀浣花圖歌詩翁銜袖出清詩醉墨淋漓驚乍寫明珠炯炯照户牖恍疑驪龍睡遺者彌明髙唱詩云云此翁一掃如飛蚊詩狂克念酒作聖樽前笑殺劉師命李白張旭稱世賢姓名優入少陵編平生我亦忝詞客自得此詩輕尺璧他年别去長相憶

body:
  text: 提要香山集十六卷别集類三宋臣等謹案香山集十六卷宋喻良能撰良能字叔竒義烏人登紹興二十七年進士補廣德尉遷國子監主簿復以國子監博士召兼工部郎中除太常寺丞兼舊職出知處州尋以朝請大夫致仕宋史不為立傳惟金華先民傳載其仕履頗詳其兄良倚弟良弼亦俱以古文詞有聲于時集中所稱伯夀兄季直弟者是也良能所著忠義傳二十卷諸經講義五巻家帚編十五卷俱久佚不存其集義烏志作三十四巻焦竑國史經籍志作十七卷世亦無傳獨永樂大典中所錄古今體詩尚多核其格律大都抒寫如志不屑屑為絺章繪句之詞楊萬里朝天集有送喻叔竒知處州云括蒼山水名天下工部風烟入筆端頗相推許而良能集内亦多與萬里酬唱之作故其詩格約畧相近特不及萬里之博大耳又陳亮龍川集題喻季直文編一篇云喻叔竒于人煦煦有恩意能使人别去三日念之輙不釋其為文精深簡雅讀之愈久而意若新是良能之文亦有可自成一家者惜其詩僅存而文已湮沒不傳矣今從永樂大典採掇裒次而以南宋名賢小集所載參校補入釐為十六卷庻猶得攷見其大畧其集稱香山者案律中次韻李大著春日雜詩中有清夢到香山句自注曰余所居山名蓋以地名其集云乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:e52da7fdf22957dd5f807f3a3f57260313a3c7a2d8a28aef645bb36c53657aad

body:
  text: 香山集巻十四宋喻良能撰七言絶句望月臺灧灧氷輪林上頭煙銷霧斂桂花浮要看夜静天如水莫遣疎簾不上鈎題太白祠堂長安酒樓歌管新一曲烏棲泣鬼神狂客解龜同一醉人人知是謫仙人倒披綺裘草褁巾酒醒玉山來映人明月滄江故無恙騎鯨何處狎龍鱗潮生采石波濤險秋入青山草木寒千古風流無處覓空吟亭北倚欄干初到廬山匡廬山水甲南州况是曾經靖節游眼底總堪供賦詠新詩不礙細雕鎪温泉不與驪山脂水并獨於廬阜占佳名我來試作泉間浴一洗平生病惱輕題開先寺飛橋次待制王公韻潄玉亭邊百尺橋游人平歩玉虹腰慿欄下瞰清淵底秋水無塵浸碧霄游柴桑懐淵明二絶語客歸休醉欲眠素琴雖蓄本無絃南窓寄傲北窓卧買斷清風不用錢草莽連雲舊逕荒人人稱是古柴桑園蔬籬菊知何處喬木蕭蕭挂夕陽題石榴洞有客持柯石門道避人避世白雲邊相逢驚喜還相問應説經今八百年溪谷幽深可避秦桃源風物畫難真思量却得藍超力解遣人知洞裏春當年雞犬白雲中屋角榴花帶露濃洞口只今無處覓唯餘碧水繞青榕登清音堂堂上横看江上洲洲邊春浪拍天浮晴欄倚遍無多景浩蕩時時没白鷗洲以檀槽舊得名風來草木自成聲青衫司馬令人恨只作潯陽送客行平生秀句誦隨州今日身親歴勝遊欲賦江山無好語强賡歸鳥與孤舟彦禮提宫以詩見招赴惠山登髙之集次韻奉酬王勃揮毫滕閣上蘇仙把酒華山顛去秋相與追清賞回首匆匆又一年西風揺落雁南翔萬里晴空一洗凉幸有從來茱菊約敢辭相對引壺觴題徐子由菊坡圖先生萬事不挂眼獨向秋叢餐落英未省折腰營五斗懸知今日有淵明葺坡種菊當餱糧想見西風百本黄安得一尊相對飲為公滿意賦柴桑清心堂雨餘池水淡泠泠霜後梅花照眼明題作清心知未稱此心元自不須清去嵗十月六日由番江向安仁今嵗十月回自廣信復以是日同王藍田諸公登安仁張古峰去嵗兹晨離楚東今年飛盖上晴空煙雲晻靄江天暮一笑都如夢寐中懐王侍郎劉祕監平生西蜀劉中壘四海東嘉王右軍三載相思千里夢何時把酒聽論文臘前二日見青梅桃花澤國寒多春事遲南來地暖意都迷城隂雨過臘初近梅子青青桃滿蹊丞廨之後正瞰城城上有古木十數株盛夏五六月清風徐來蕭然有山林之趣嘗誦陳後山城荒可當山之句欲作亭對之榜曰當山而三嵗之間十捧差檄三攝劇邑猝猝未能也今且去矣乃留詩壁間庶㡬後之君子㑹有成吾之志者地静城荒可當山士衡瓦屋兩三間作亭領畧吾何暇留待來賢涉筆間次韻趙十太尉留題驛亭絶句青衫憔悴鬢毛蒼還記并州舊葛强楚尾吳頭秋驛好喜聞嚼麝笑談香愛山栁絲稀處見前山半在雲間半霧間回首亂紅濃翠裏春風啼鳥更綿蠻朝爽軒紅蕉著花喜而成篇青綺叢中蹙絳紗碧雲闕處抹晴霞凌霜窈窕含朱彩消得愚溪作意誇題泛五湖遊東山圖陶朱西子功名後安石東山隠遯初畫圖三挹春風面豁得平生俊氣無亦好亭獨坐亭上横看十六峰峰頭烟靄碧連空不須更作遊山計坐遣詩情落酒中湖口主簿劉君少魏以皂湖石二峰見遺其一盤抝呀豁彷彿金華洞天因目之曰小三洞賦詩一絶片石來從鳯枳家天然崕窽自唅呀從今喻子新三洞不減坡翁舊九華病起寝瘵初休意未便篔簹生筍栁生綿誰能朅朅團欒走只要齁齁酩酊眠㡬嵗思歸今得歸一笻三逕共忘機寸腸滿貯愁千斛的當回頭覺昨非㳄韻槐卿舅詩寄石榴細髙風物總幽竒朱實離離瘦玉枝居士既為東道主文人休勒北山移六月十日偕夏卿兄季野孟明仲文季直弟游香山因得小詩書僧堂壁夏木隂隂翠竹疎相擕蕭寺饌伊蒲他年細味禪房句便是香山六老圖孟秋七日邀從兄廿五宣義四弟五姪同飲錦園即席之作湖水林風清復清買肴置酒七峰亭直須待得玉鈎掛要看牽牛織女星何遜梅花詩云枝横却月觀林和靖云水邊籬落忽横枝又云疎影横斜水清淺是或一律也亦好園江梅一株枝横丈餘作平壇鑿小池於其下壇池初成榜曰横枝喜而賦詩却月枝横淮海初水曹句法到西湖横枝影瘦池清淺竒絶何人作畫圖三月六日清明節道中清明時候雨初足白花滿山明似玉道傍滿山皆白花問之樵者曰此繭花也十里春風睡眼中小桃飄盡餘新緑北山登髙九日紅茱紫菊催相擕緩步上飛來酒酣便有龍山趣不用重尋戲馬臺陳益之李兼濟皆為余作大字書此二詩渡江至侯官鎮記所見破臘侵星渡急流曉風吹動黒貂裘黄雲不斷碧雲暗荔子林邊甘蔗洲峽橋驚流落石震林坰一洗紅塵耳目醒妙語曽聞杜陵老髙江急峽鬭雷霆百尺危橋跨綵虹快輸白浪入晴空眼驚巫峽江山近身在蘇仙詩句中文舉司理以鸂䳵一雙見遺作詩為謝五采斕斑好毛羽金沙石礫映毰毸我無御史西臺望安用一雙鸂䳵來贈神童陳樸陳郎七嵗富三冬此去聲名動九重好踐退之童子序莫隨劉晏頌東封就報恩借碾碾茶彞老有詩因次其韻斷無鵝鴨惱比鄰賴有鐘魚隔竹聞故遣新茶就佳磑要供戯綵滿甌雲七夕戯詠别多㑹少兩情深風幌雲屏喜不禁誰道初秋清夜永須知一刻直千金巖桂粟粟枝頭淺淺黄十分風味百分香廣寒宫殿清秋裏掠削雲鬟試靚粧枝頭金粟色偏匀空裏非煙氣自薰莫把白旃檀漫比香濃猶得逆風聞水沉風味欝金黄風定猶聞十里香造物普令薰一切故應五濁暫清涼謝司路鈐遺菊花塔夫君遺我菊浮屠分得清香供讀書突兀便髙三數尺層層畫影緑扶踈謝陳蘇州送酒宫庠寂寂雀羅門寧有賢人倒緑樽賴得蘇州情義重肯令從事問寒温元日追次東坡和子由省宿致齋韻五十之年又過三依然白髮照青衫年來大起山林興任達從教笑阮咸人日道中口占初日輕烟溪上橋逺峰積雪未全消東君也是多情思先遣春光到栁條竹籬茆舎水邊家窓牖虚明小逕斜草色未多春意好疎梅映竹兩三花書紅香堂壁瓦影鱗鱗䕃曲塘疎簾不下縱荷香緑波乍識紅粧靣未忍輕将比六郎參議林郎中蓄乗軒君向來止有其一今日見之乃有嘉偶因得小詩物情非耦不能久並蔕芙蓉亦自雙珍重鶴君新得配故應清唳徹秋江南劍道中桂樹青青百里疆鷓鴣啼徹午隂涼延平津上峰如削劍去江空水自長九曲溪扁舟一葉破漣漪九曲窮時山更竒喚取謫仙來著句平章佳處要清詩十年來往大江東每為青山引興濃自到此山尋絶境悔看五老九華峰遊龍井九月十日天氣涼桂花零落菊花黄竹根如意雙不借放眸一望海天長天人彌天同一游灑落珠璣不自休二老風流今浄盡空餘怪石對龍湫致身通顯大槐夢快意畋魚紫石潭何似相擕古蘭若細看香篆味茶甘次韻馬駒父晚菊五絶朔風吹冷破檀心浥露匀鋪瑣碎金喜見鮮鮮長踴躍只應吏部獨知音開及梅花未發時那愁三弄有桓伊何時栗里東籬下冷蕊寒英伴酒巵嫩黄初破未凋殘風露相禁曉色寒欲並墨梅兼墨竹何人為作畫圖看不知香靨為誰開衫染鵝黄巧翦裁但得目成兼色授何妨頃刻耻樽罍霧幌褰開秀色明麴塵半臂亦多情芳菲不擬親桃姊蕭灑端宜齒石兄莆陽道中閩粤溪山處處經長松夾道奏簫笙只應行客忘勞役千里清隂管送迎乗風雨登舟至麴院猛雨連天水滿湖扁舟風撼碧濤麤掀髯笑詠煙波裏兩岸人應作畫圖登蒜嶺三年烏石山邊路每恨南留未北歸今復無端登蒜嶺却尋烏石認親闈次韻趙景明初見梅花不解何郎五字詩年年長是探梅遲未甘辜負春消息强擬來看竹外枝

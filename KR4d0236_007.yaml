  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0236_WYG_007-1a, image: WYG1151/WYG1151-0682a.png}
body:
  text: 香山集卷七宋喻良能撰五言律詩次韻李大著春日雜詩十首春晚饒芳景官間得細看隔窗黃鳥並開卷壁魚乾過雨蒼苔濕迎風翠竹寒髮華搔更短斗酒自相寬漫仕歎遲暮卜居城北偏已教山白石秖欠沼清泉簾透一簷月窗橫數尺天雜花還映竹故故自芳妍賤子知何幸萊衣老更斑白頭居杜曲清夢到香山余所居山名琢句愁雕腎銜杯喜渥顔此身慚暮翼飛倦未知還偏親須寸祿匠院敢辭留頗愧花經眼還應草喚愁身唯親布被交已絶牙籌詩興抽毫足無勞入海求花日淺明牖竹風低度墻舉頭空弱絮轉盼墮危芳興遣慿毛頴愁消賴羽觴隂隂繁夏木故里耿難忘借居仍種菊往往似天隨日味三春酒燈明午夜棋間臨永和帖細誦建安詩潦倒同中散歡欣似啓期帝里春仍好風和晝漏遲但懷三釡樂遑恤北山移老大諳斑戲空疏愧色絲平生杜陵老耿耿寸心知屯雲初解駁曉日有晶輝城郭紅塵軟江湖春水肥小舟浮緑淨芳徑步熹微起我故山思多慚未拂衣素髮已垂領故園猶未歸鳥聲思磴道栁色憶荆扉嫩緑枝邊暗殘紅葉底稀幾多新乳燕一一出巢飛二載違枌社全家客帝都濁醪充上頓清俸付中厨親老唯須養皇恩詎敢孤逍遙處山澤未忍學仙臞次韻王龜齡春日湖上春老花茵積雲開天鏡磨暖風今日好細雨向來多栁蔭青絲障湖明金叵羅何時成醉倒煙草藉晴坡羅春伯以吕居仁集寄似作詩為謝平生子吕子妙語總關心忽得詩三百端勝書萬金愔愔醒睡眼炯炯淨煩襟何以報嘉惠空慚緑綺琴六月二十二日夜省宿一首省廬頻宿直何異在承明地峻江聲近風輕荷氣清鬢毛真騎省詩思小隂鏗記得山村日馳情向玉京印印詩有序豫在工部常兼屯虞水三印去嵗八月一日暫攝奉常三日復暫權禮部又兼二印為五信宿乃生印印故以命之生八月餘而卒今嵗仲秋五日蓋其周晬憶而成詩印印秀而好明眸氷雪膚逢人賞岐嶷問宇識之無若有萬金藥真成千里駒空花今已矣晬日一長吁十一月二日與陸明府陳廣文黃使君吳都曹江廣文同飲於閎中堂修年契也酒後耳熱因得小詩呈似菊色猶黃處梅花未發天三山千里客一笑六同年公等多朱紱豫方乏坐氊清談仍痛飲應作畫圖傳同德坊寓居天地方搖落江湖入夢思三為京輦客十見嵗華移亹亹金閨直蕭蕭素髮垂殘年飽喫飯細誦少陵詩檢書偶見故王侍郎嘉叟舊與余倡和之什良用慨然因題四韻文字名三世精神運五兵徒看遺墨在却嘆曲池平浙右頻犀麈江東幾兕觥倡酬今已矣撫卷淚縱橫挽髙宗皇帝詞扈從浮江日憂勤立極初八年躬甲胄萬國混車書治定端無競功成自不居休明嫓虞舜逸樂夢華胥天地重開闢民人拱德馨奎文贊元聖宸翰列羣經禮樂盈三紀光華亞九齡龍髯攀莫及臣子涕交零入局言懷學省清秋好無塵意趣長講餘簾影靜坐久綵衣涼未有禆王族真成耗太倉顧慚麋鹿質亦許玷朝行寄宋子淵運使對閣思槐市成規愧奉常六年談笑阻千里夢魂長將漕衣仍繡空餐鬢已蒼何當奉犀麈風月要平章判院蔡文和豫五詩次韻一篇奉酬病起驚華髮官間覺素餐文章慚李益名譽羡蘇端老去觀書懶愁來避酒難非關作詩苦自爾帶圍寬黃講書太器見和五詩次韻一篇奉酬客氊寒莫致官舍總蕭然睡思茶甘外窮愁酒力邊未成投轄飲時作撥書眠野鶴如雙鬢衰遲秪自憐獻之大著得豫喜賦以詩來謝次韻奉酬奪袍吟處筆墊角雨餘巾黃絹才無敵青藜杖有神將乘桓典馬肯受庾公塵老我知何幸窮塗獲卜鄰茂林見訪有詩次韻奉酬解鞍揮玉麈亹亹笑談清昨夜燈花喜今朝乾鵲聲興同狂祕監詩似老彌明憶昔南臺北相逢蓋始傾陳彥山寄示新詩次韻奉酬山園寧厭小間地只如馨木落長天碧雲飛逺岫青故人應見憶新詠許時聽句好何勞琢雖搜不用冥題周希稷清閟軒之子藴琅玕幽軒足考槃蘢蔥煙翠濕瑣碎日光寒似向蘭亭見全勝墨本看是中雖信美未可懶彈冠喜雪同雲生舊臘積雪入新春野色連滄海歡聲動紫宸峰巒朝掩映樓閣夜精神莫展山隂畫雖工不是真贈陳宣幹嗜古心仍切尋詩句益工十年江左别一笑日邊同補外吾天幸懷歸子道東好為旬朔欵解榻待春風侍親由三山還東陽南雪不到地玄冬偏滿山春風仍料峭綵袂正斕斑廣厦千間靜虛空一宿間此身如羽翼飛倦始知還文舉仙尉以詩寄似兼惠新安紙乳洞茶次韻奉酬閉户鶯聲老開緘鯉素新多慚青眼舊逺寄白頭人佳楮氷天繭芳芽雪洞春著書兼破睡勒謝敢辭頻題雲黃山寶林寺彌勒下生地溪山秀且長蕭蕭雙樹碧冉冉片雲黃曉日觚稜淨西風松桂香十年疏杖屨玉石耿難忘錦園孟夏錦園好山花髙下開風欹紅芍藥雨重紫徘徊衣染香邊蘂鞋粘緑處苔鶯歌兼蝶拍時送掌中杯山園多勝踐繚繞磬湖濵畦藥青生甲湖波緑動鱗鵓鴣知欲雨鴉舅報將晨却憶京華日長懷浩蕩春題何茂宏茂恭林堂華堂閟林樾林秀水泉甘野色袁家渴秋聲鈷鉧潭二難今有此四者許誰參他日承明直懸知憶翠嵐月桂堂月桂堂何有池清桂影橫畫圖寧辨此玉斧巧修成入夜境逾妙才秋風又生饒陽巖石下隱約欠分明上饒有巖如月巖中一樹如桂名曰月巖草五兄宣義見招偕諸弟赴新亭宴集即席有作瀟灑新亭好松長桂亦稠清秋集鴻鴈暇日勸觥籌既逺含香直何辭秉燭遊主人情義重終宴不知休錦園雙桂植之二十八年未嘗著花今忽盛開紫趺黃蘂所未曾見喜而賦詩疇昔栽雙桂于今四七秋紫趺香冉冉金蘂色浮浮標致殊他桂風流最蓐收無才強摹寫著語故難遒八月十三夜仲季二弟弄月亭對飲今宵端正月故故向湖山玉兔窺杯凸氷娥怪鬢斑詩情甪里逸酒膽夏黃慳興罷度橋處天風松桂間次韻程觀過夜飲靈濟祠下松月瀉清影爐煙凝宿雲檠燈寒照席樽酒細論文清漏轉三鼓芳杯釂十分絶勝銀燭裏妙舞看榴裙送朱師古少卿歸蜀西蜀多賢士于今見奉常十年方出守萬里好還鄉峽水冬無險河圖晚有光臨歧分手處政爾不能忘丞相王公挽詞炎統中興日淳熙翊贊功憲邦同吉甫待旦類周公一品恩榮重三朝禮貌隆欲知勳業盛請視鼎彞中維嶽鍾英粹興王有俊良文章周衛武書考郭汾陽調燮民庸茂彌縫主道昌中台一宵坼四海淚滂滂疇昔翹材館疏庸獲屢遊衮衣無傲色吐握有勤求輔弼十年久雍容片善收至今天下士語及淚交流丞相大資葉公挽詞雙溪鍾地讖一相破天荒道至黃扉重勳由紫府昌堤成歡百辟台坼泣羣方盛烈銘鐘鼎千秋耿不忘德望堂堂重威名凛凛寒三年衮衣粲四海寸心丹緑野悲裴度蒼生憶謝安白頭賔客在慚痛淚闌干挽商元鼎舉世方貪祿斯人秪自怡一官如涕唾半世足遨嬉心地陂千頃生涯酒一巵唯應郭有道吾不愧為碑挽黃泰之漢世無雙價皇朝第一流文章驚北闕名譽滿中州槐市師模邃蘭臺史筆遒所嗟時未合不作濟川舟挽樓士特平生易諸子向我獨拳拳雪屋傾銀斚春風並錦韉笑談多竟夕契濶未經年來作生芻奠凄涼涕泫然挽唐立夫舍人才名振西蜀老氣益中州草制追盤誥籌邊動冕旒已令榮壓角復遣飲遨頭千古九江恨長隨逝水流挽石似之郎中幾作儒林冠親承帝渥隆雙旌大江左一節古吳中列宿英聲在浮雲舊事空無從挂吾劍老淚濕西風挽國史侍讀李公仁父大名垂宇宙秀氣發岷峨學比淵雲贍才方賈馬過九朝資直筆二子振賢科已矣流芳在千秋保不磨挽處士陳容乾坤身老大邱壑迹委蛇不枉安車召誰為薦鶚詞平生五千卷身後寧馨兒他日編遺藁應多感遇詩歷數鄉閭老誰知德齒尊無心遊魏闕有意樂丘園漫不霑三釡真堪映九原涕洟歌楚些已矣莫招魂挽李靖少傅夫人九月秋光急山川苦霧迷卜邙新隧啓度鞏短簫齊寶劍知終合靈蟾已隕西松門來會葬車馬幾千蹄板輿曾至鄭靈輤此歸周靄靄雲將夕亭亭月正秋九原開祔穴故土覆新丘嵗晏寒松下茅苫孝子留挽湯丞相漢國夫人七秩芳名盛于今等逝波承天登宰輔看子掌編摩鳯去青春獨鸞回紫誥多他年彤管史兼述采蘩歌

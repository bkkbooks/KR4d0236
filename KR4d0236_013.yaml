body:
  text: 香山集巻十三宋喻良能撰七言絶句錦園小春細雨將春上曉枝東風吹緑到漣漪長溝繞檻多佳處小逕穿花無盡時春雨晚風吹雨過西疇惻惻輕寒似早秋燕乳鳩鳴春又老可堪芳草喚人愁春隂不斷怒鳩聲日日溪雲帶雨行試挂西窓看霽色一川煙草畫難成春日偶成煙霏初散曉寒收花氣烘晴草色浮一片風光吟不盡青春池上海棠洲戲詠書案上江梅水仙偷将行雨瑶姬佩招得凌波仙子魂幽韻清香兩竒絶小窓斜月伴黄昏夀星泉水邊豈無清江使石上自有黄冠仙更須喚取遼東鶴便是人間不老泉次韻楊廷秀郎中游西湖十絶湖波萬頃瀉鎔銀妙句誰能敵李紳橈影緩隨紅蓼㟁荷香細著白綸巾蕭蕭竹徑細通幽小憇明窓瀹茗甌夏木隂隂可人處黄鸝飛上碧枝頭裴園亭榭水之濵草樹雲煙滿目横盡日對山仍把酒兹游絶勝若耶行與世從來最濶疎年來况復味潜虚漆園不嗜濠梁樂人自人兮魚自魚憶昔孤山和靖家光風霽月總輸他㡬多水草連煙草無限蘋花雜藕花誰云騎馬似乘船揺曳中流即水仙香繡㡬屛波底影煙綃千幅望中天湖堤樓閣劇蜂房樓上争看湖上航萬柄芙蓉清冉冉臨風新拆麝臍香一時談笑總名流十里西湖恣意游熟醉側身窺翡翠狂歌左手把蝤蛑袢暑渾如深甑炊涼颸一餉最先知慿誰為覔丹青手畫我談詩剥芡時湖邊幽勝滿青蓮到處時時泊畫船竟日漣漪吟不足欲歸重看水中天九日無酒年年把酒對黄花一任西風醉帽斜今日無錢還對菊不知何處酒堪賖雪翦水輕花著地消弱肌無力倚風飄欲知回旋空中舞恰似楊家静婉腰曉行樹頭鳥語落虛簷清夢驚回睡未厭笑跨紫騮穿緑徑晴雲凉月正纎纎道上口占隴北麥苖初覆塊舎南梅蕊已含鬚小春似有芳菲意憑仗何人為寫圖詠梅竹外江頭帶雪看花中清絶畫應難玉肌瑩骨氷姿瘦單著生綃怯暮寒三月十四日陪同年十有六人游浄慈遂飲於水月居坐中即事車馳卒奔風雨過粉白黛緑春事妍裙腰政佳酒仍美那復有路到愁邊崇桃穠李亦不惡一笑海棠尤可人徐熙趙昌俱骨朽翠䄂捲綃誰寫真美酒未盡雙玉缾更聽提壺鳴不停斜陽可飲徑須飲趁得城門打鼔聲凝香閣渠渠夏屋翠隂稠沉水香濃瑞靄浮媿我無才吟五字未妨燕寢似蘇州上巳郡宴即事細雨輕隂修禊天海棠睡足栁初眠凝香簾幕東風煖小醉清吟錦瑟邊次韻葉宰植竹四絶檀欒節目瘦長枝晴既蕭騷雨亦竒誰道此君惟澹泊細看頻賞自多姿蒼煙翠霧兩冥迷秋雨叢深不作泥冷葉寒枝須管領亭亭㑹見拂雲齊誰云青士太無情偏結騷人冷淡盟不假遥岑分寸碧故應雙目自増明木本曽看煙雨梢臨窓依砌韻偏髙可憐不入繁華眼秪稱清談王馬曹偶成祠山東畔古桐西垂栁隂隂映短扉誰道官居太蕭瑟香粳甜輭鱖魚肥至徳至徳春山紫翠堆楚東征吏又重來是中正好覓佳句捫腹自憐無此才齊山龕巖宜號祕宻藏翠㣲應呼清浄身欲慿妙句發佳境安得揮毫我輩人池陽報恩寺新成輪藏應公出示鮑仲山詩因贈招提雄冠浦邊州寳藏琅函眩電眸更出故人竒絶句相看知是賛公流遊青山當塗王使君命供張甚適雨映青山訪謫仙公厨分釀割肥鮮酣歌一曲西風裏頓失羈愁向酒邊放姑惡為憐心折骨仍驚四十方兄博汝生從此直須防巧中著身未穏莫先鳴春日道中絶句繚繞孤村一逕斜緑楊深處有人家翠眉紅頰墻頭出淡淡春山淺淺霞次韻何茂宏見寄牧之俯首隨繮鎻元亮髙情樂里閭樽酒未能供一笑尺書多謝附雙魚登寺後峰絶頂杳杳扶笻上翠岑松風蕭颯五雲深不知直自登臨處下至平川㡬百尋洄溪閣十尋傑閣倚雲隈淡靄輕煙照眼來山色不隨天際逺溪流長為水深回蓬萊閣絶知蓬島異塵寰弱水相望萬里間争似卧龍雲際閣不勞跨海即鼇山自入新安境中鴨脚千樹羅生道傍秋實離離低拂行客顧之欣然因成絶句離離秋實壓枝柔帶露含煙爛不收須信新安生鴨脚大勝霅水熟鷄頭今嵗鴨脚盛生任公釣臺任公垂釣古來稱千載危臺尚可登尺澤只今無處覓懸知深谷解為陵好溪堂好溪無復怒濤麤繚緑縈青秀色腴更著華堂臨絶境風流長與峴山俱凝霜閣巋然飛閣榜凝霜雪散氷丸却暑方治郡風流無處覓只應棟宇是甘棠題靈源洞細數峰巒到石門緩移屐齒歩雲根一樽濁酒林間坐古木蒼蘿日月昏鬼鑿神鑱巧更紆直疑有路到華胥坐來濃翠沾衣冷恰似飛來秋意初昌園賞梅園一作原十年不踏淮安路今日昌原得縱游千樹撩人詩興動恰如何遜在揚州縣齋夜坐鶩行散盡室如氷數巻殘書一穗燈尚有茹葷兼飲酒不然全似打包僧余禱雨龍湫翼日響應兒子興之有詩紀實仲文季直弟亦既同賦老子久不作詩因得絶句龜齡昔禱五龍廟曰雨而雨若有期我無能為此云役雲螭何事不相違龜齡王公昔守鄱陽禱雨龍祠不旋踵而應事見五龍廟碑餘干資福寺巖桂盛開因折一枝戯成絶句緑玉枝頭金粟團可人風味勝紅蘭一枝擕向金溪去袖裏誰知有廣寒雲錦閣巖花亂落隨春水萬丈輕紅遶驛樓不是江流似雲錦政應雲錦似江流上清積雨新晴翠靄浮好風掖我上清遊白頭捧檄真聊爾那忍深文學杜周七月晦日聞鶯憶得東風汎蕙蘭曉窓紅樹聽綿蠻如何却到深秋節盡日猶啼修竹間九月八日次韻沈虞卿一首白髪蒼顔㑹帝鄉㣲雲淡雨小重陽一樽相屬非無意欲攪胷中書傳香次韻朱昻仲見寄一絶使君詩酒日娛嬉燕寝新來一段竒政是夢熊佳節裏釋迦抱送寧馨兒九日鞫獄茶山廣教院遣興一絶牧之秋浦峰頭飲王勃南昌閣上吟千古勝遊誰復繼只今重九欠登臨鵝湖雙松亭白壁長廊數十間峩峩佩劍兩蒼官艷陽滿目皆桃李晩節如公可嵗寒石扶山弋陽界中玲瓏怪石巧相扶竒絶無人作畫圖要是飛來嫡孫行恨君生不近西湖松源山征途未盡弋陽西且過松源九節溪煙雨濛濛山色好鷓鴣更與盡情啼懐愛山空陂流水淡泠泠小立舂鉏㸃逺汀煙雨半收山更好知誰不喚作丹青仙隠觀費長房故宅舊名靈陽宫觀後有葛陂盖竹杖化龍處也松風百步到靈陽千古風流憶長房竹杖化龍無處覓空餘陂水繞堤長題谷簾泉此水名傳自昔賢味甘誰敢鬬芳鮮一甌雪乳初嘗罷知是人間第一泉月臺青林闕處緑隂開十里長風送月來妬雨玩雲都浄盡素華清影巧裴徊琵琶亭琵琶人去㡬經秋司馬青衫亦故丘唯有當時亭下水無情依舊更東流次韻梅花絶句玉裙練帨清無塵一笑喚回幽谷春天寒日暮故相惱不怕近前丞相嗔次槐卿舅詠梅二絶玉肌氷骨不多枝半映清池半近籬寒雪尚遲新月早横斜分影到漣漪朔風寒日澹孤芳氷雪相看有暗香但得横枝臨却月不須斗酒博西涼石鐘山坡翁文字妙來今仙去遺蹤杳莫尋惟有石鐘還好在未須霜降自清音題煑泉亭甘香曽飲谷簾前擕茗仍來試煑泉更覺清風生兩腋始知鴻漸是茶仙

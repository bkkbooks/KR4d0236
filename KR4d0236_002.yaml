body:
  text: 香山集卷二宋喻良能撰五言古詩石鐘山南北兩石鐘上下一水側造物妙鎔冶蜚亷巧撞擊鏜鞳仍噌吰歌鐘與無射豐山吾焉知蒲牢爾何力咨余久願遊偶此事行役時秋風颼颼日暮水激激初如鈞天鳴乍若金奏寂入耳粹而清洗心欣以懌怪竒有如此遊覽誰能測發端示來今注經人姓酈題淵明醉石平生憶淵明偶此訪遺跡柴桑僅未泯栗里猶可識寒溜淡泠泠孤煙輕羃羃撫事良多感西風生醉石愧陶淵明在彭澤到任八十日雖營三徑資未穫公田秫珍重千金腰不為督郵折拂衣賦歸來何異自投劾我生本樗散山林久蟠蟄雖非淵明儔頗亦慕幽迹偶然得一第遂竊升斗秩未書藍田考已捧錦溪檄荒縣饒逋負催科費鞭抶彊顔簿領間忽復彌數月心焉愧淵明俯首三歎息番江何時還哦松聊自適送吕憲帥維揚讀我宋實録元豐治明昌五年九月中上特開天章從容謂輔臣邊民疲可傷吕獨為朕言他人終未嘗已乃命正獻由定帥維揚學士加大稱庸以示寵光移鎮未去久趣歸總臺綱爾來九十年淮其踵遺芳我公嫡孫行祖烈蔚載揚持節古閩粵攝事今福唐仁風雜和氣盎盎如春陽氓謡玉律響圜扉春草長英聲飛九重御屏書益詳廣陵大都㑹經理須才良擁麾往鎮之非公諒誰當延閣升寶書恩綸湛洋洋左符分淮海西顧寬巖廊想見入境初快覩爭星凰折衝向樽俎宣威振金湯行看鋒車召衮衣侍虞皇賤子一何幸竊庇逾兩霜誤蒙剡薦牘名徹凝旒傍受恩未知報肝膽徒激昻唯祈轉洪鈞復立弟子行偶題少陵五十六負暄候樵牧我今年與齊而亦處幽獨小亭數椽淨新月半鈎曲聊將萬斛愁付與一杯緑十月五日從兄四弟三姪侍太孺人賞菊亦好園以賞心樂事為韻分得賞字霜天豁澄明水日共清朗西園足甘菊歡言事幽賞板輿奉慈顔華髮森少長一笑喜團欒千枝迷俯仰黃英浥露繁翠蔓緣籬上雄蜂與雌蝶採擷紛還往逸興既中酣佳致仍外奬未多彭澤賢不羡天隨廣憶昔吏江東王事困鞅掌及今處閭里暇日娛塏爽殽酒雖不豐獻酬非或强分韻先阿連作詩真技癢閎中堂危簷覆虛明景趣清且長曲池散漣漪珍木含葱蒼離離荔子丹冉冉茉莉香有堂既足佳無氊庸何傷次韻提舉王正言寒食游茶焙摘山勝煮海財貨所源流建焙甲天下賦入十倍收國計頗賴之貢輸何時休擇人為提領得賢從宛丘文章脫吏腕風味登瀛洲佐職亦已久再見春草抽郊原富槍旗嵗事日以修撫民端若子疾惡信如讐驅車向鳳山父老觀道周青春行畫圖佳處時一留風前耳潺湲雨後目纎柔酒酣已勝賞珠唾揮釣鈎咨豫素么麼受恩猶未酬銘心雖甚堅撫己徒懷羞平生困坎壈暮年尚依劉投公一紙書逺寄粵王州書傳得妙帖想像寒食游終防好事人豪奪或巧偷題紅雲島紅雲覆絶島望之心神開弱水不負舟何由至蓬萊吾欲煩巨鼇為載三山來不然騎鯨去一醉流霞杯豫去嵗五月由浙入閩見夾道長松黛色參天行者均被其䕃間有為斧斤所戕者缺而不補十步一歎顧恨方為校官非所職掌不得以封殖培壅之事告之部使者懷不滿之意彌年於兹矣比竊聞提刑承宣命尉曹若僧徒封殖其有而補其所亡期使道路之人行千里若宇下而無病暍苦熱之歎其為全閩無窮之惠厚矣豫自少喜讀栁子厚詩見其稱商山臨路有孤松往來每斫以為明好事者憐之編竹成援遂其生植感而賦詩中有幸逢仁惠意重此藩籬護之句每愛而誦習之今輒追次其韻以紀一時之盛亦古今甘棠之意也雖言詞不工蓋欲自附於國風之末庶幾他日採詩之官或有取焉鬱鬱千丈松誰栽䕃修路年祀寖綿邈斧斤時謬誤皇華重憐惻霜根辱調護他日比甘棠流風繼行露夜宿天章寺蘭亭負崇岡修竹翳寒緑囂煩隔人境爽氣森佛屋薄暮行役罷言就上方宿是時秋峥嶸西風響巖谷越蘭不可見浩歌想餘馥右軍恨何許禊序空三復夜久百蟲絶燈花媚幽獨蕭然四壁靜一洗塵萬斛何當脫羈鞅隂巖事卜築聊復得此遊淡然心賞足華峯亭華峯抱紫翠兹亭瞰清幽春林羅畫屏新月吐玉鈎宛如東屯居恍若南澗游信美吾亦樂特用慰淹留己亥中秋二七月皎皎三五雲沈沈終然露半璧亦復牽孤吟夜久羣動息唯有寒蛩音長年重節序感慨非獨今勿言魯酒薄為史端叔作也端叔同寮於越未終更求奉中都祠歸丞相侍傍作是詩以送之同寮雖云多交友未易結臭味一小異肝膽便楚越君侯宰相子風度何翩翩四偕計吏貢春銓復褎然一見蓋為傾相逢豈在早白髮與紅顔論交非草草君才若杞梓真能世其家顧我如駑駘秪堪服鹽車心情過中年何翅數日惡徑須釂一樽勿言魯酒薄大雪追和退之辛卯年雪韻太皥亦已至元冥猶未歸茫茫天壤間浪闊銀山圍玉龍橫梅度皓鶴漫空飛白帝有所適飄飄揚旌旗從者一何繁縞席仍練衣招邀姑射仙逢迎廣寒妃祥耶時令耶疇能測天機飢人凍欲死賞玩理則非安得萬裘褐寒者或庶幾願言均此惠不知身賤微次韻奉酬刑部王嘉叟侍郎書戲綵集後制作參易經不用草𤣥準眼空天壤間誰得並捷敏鴻文翻水就未省苦吟吻齊梁逮陳隋衆作付一哂南國容本冶西子髮更鬒混然真天成寧復分域畛飛上青雲端秋空擊鷹隼豈唯持荷槖已復班玉笋雖未究所長要亦攄素藴大手秉綸綍至音發簴簨嗟豫墮詩窮政坐無鉛粉數竒秪自憐多忤誰汲引有賦難逐貧無詩不招隱明公獨深憐不嫌邊幅窘謂雖敝帚如或可充貢箘恃此以無恐枚臯窮久忍儻復念菅蒯庶免辱荆槿次韻宗郎中師仁見示古風平生癖於詩業債餘清淨但己心孔開敢誇筆鋒徑疾書或欹斜所向必雅正顧慚非晉人出語那韻勝亦好三畝園松竹互掩映門闌雖間啓俗客未省迎豈唯愜幽情頗復動詩興朅來古泮宫未諳麋鹿性何處更有詩抗走足不定宗英出大篇重此緑綺贈未應費推敲詎止工競病此作不為妙妙處知難更吟壇將風雅瑣尾宜退聽賀白真雁行離騷可奴命熟復句中眼如對麈尾柄迷途獲指南從此識畦徑自應形贊歎誰復獻嘲評佳處未易知當有識者證送髙炳如倅天台髙侯吾所畏學問覷壼奧秋水瑩精神春華麗詞藻三館朅來游兩鬢青未皓何心玩嵗月刻意事探討二志既崇成八書可偕考烏臺竚風采綸闈須典誥引疾遽有祈勇退一何早丹丘非大名泥軾僅小好㑹看有詔追豈必俟身到行矣即輕安愷悌神所勞張持荷示詩編次韻一篇為謝先唐詩道昌萬象繞吟筆長吉窮嶮怪奚囊銷永日一洗齊梁陋古淡見摩詰詰齊妙入神二者無一失遊戲唾成珠所至動盈帙長篇雜短詠朱絃響玉律脫身聲利場宴坐心更逸髙眠聽松聲清話剝芡實聲名笑山王任逹景嵇畢時發孤鳯鳴不作寒蛩唧人譏雕肺肝悠然非所恤編成客未佳櫝藏謹勿出王丞相生辰皇宋十一葉時清風俗淳實維元首明亦繄股肱純煌煌冀國公自昔抱經綸初掌黃麻誥黼黻同卿雲繼處宥密地五兵驅精神一品坐黃扉十載轉洪鈞雍容陪都俞黽勉承華勛鏡淨滄海波煙銷紫塞塵伊傅堪並驅蕭曹真下陳柔兆嵗若午協洽寅在辰入夢一玉燕持爐兩天人二十四書考八千嵗為春西湖為酒醴南屏為膳珍萬口均一詞共祝柱石臣一祝錫難老再祝長同寅百祝配遼鶴千祝如大椿國夀箕翼齊洎公永無垠貴名與鴻烈日新日日新次韻奉酬趙景明法曹見贈宗英賀白儔肯從野人遊相見各失喜胡為俱皇州孤燈照清談新詩淡牢愁明日却分袂獨往濤江頭齊宿昭慶院祀南嶽南海秉檄奉中祀驅車出重關曉風鐵葉嶺煙雨南屏山瀹茗澡塵慮褰簾飫孱顔精意孚海嶽清聲搖珮環留别直院莫子齊少卿鬱鬱千丈松植根在崇岡清隂亘十畝直幹凌穹蒼好風一披拂聲韻諧宫商古來成大厦此物宜棟梁不待嵗月久共看柱明堂微木有石楠枯崖飽風霜三百甲子餘圍才拱把强大楹分難充一桷庶可當儻容附松末雖晚庸何傷留别王嘉叟檢正初寮久已往今誰主丈盟王公有嫡孫見者服且驚胸中九雲夢筆端三折肱招致道山中掉頭不肯譍論事常山蛇持身玉壺氷平生謝先容要津真自登四海望霖雨一人須股肱我本田家子蹉跎將暮齡相逢豈在早一見蓋已傾謂我雖秃犀敝帚亦足稱持獻先簵箘長篇有明徴公乎儻踐言庶為老親榮送參議林郎中人孰不識面相知貴知心唯我與夫子傾蓋成斷金疇昔居京邑庀職偶相臨肯紆鍾期聰俯聽牙弦琴講說三百篇一一蒙賞音朅來鍾山旁休沐同搜吟聫鑣照湖側攜手天衣岑飛鳴互嚶嚶和樂長愔愔無詩不屬和有酒相與斟餉我破羌帖佳妙同來禽復遺先聖像摹寫自孔林二年如巨蛩一旦辰與參襟期自兹逺詩盟幾時尋願言蚤盍簪無為徒滯淫游鹿田三洞東西兩鹿田上下三洞天苔徑劣容足石門低及肩乳竇斷還滴天窗皓仍𤣥何當出樊籠悠哉聊永年次韻鞏憲見示桐柏瀑布之作昔聞孫興公嘗賦飛流水至今福庭地猶屬羽人里瀑泉天半來界道見清泚迢迢白虹貫隱隱玊龍起宇宙雖云寬壯觀知能幾谷簾信有之界圖寧辨此清秋饒爽氣朱夏絶埃滓何當振金策逍遙山之趾眺覽既愜適嘯歌何窮己青鞋未成往撫己空自鄙月橋詩天逈月逾晶地偏人亦靜蕭然尋丈橋寄此緑淨境洗盞薦寒光掬泉弄清影塵逺耳目醒令人發深省約季野九日登雲黃不果季野有詩因次韻青山如候蟲可賞不可戀胡為謝康樂遊覽乃欲遍縱登最髙頂過眼猶掣電何如菊花天周繞籬落畔對面黃雲峯未妨籬下見相攜凌紫霞更約東風便送晏伯安古綢於今婺蓋亦一壯縣劇繁號難理百令無一健英英晏伯安年壯政則練咄嗟掃宿弊談笑了宿案公庭坐無事自可名道院老眼空四海於公驚創見今公賦歸歟敢以一語餞邊陲正驛騷朝野未閒燕公才浩縱橫敵可受八面要須詣明光上書還自薦口伐或箸籌收功在不戰不然飛芻粟坐使軍儲羡次韻伯夀兄殘春即事屏居事幽潛親故成久别茅簷翳濃緑酴醿墮香雪山氣清涼國溪聲廣長舌但須賢人酒安用長者轍吟腸繞碧雲醉臉暈紅纈奴耕穀可徯兒書筆難掣地偏塵不到心境兩清絶嘯歌何窮己未覺處身拙為何監獄題種德堂作堂備登覽既作扁其顔扁顔固云易踐名良獨難我友何水曹築堂水雲間瞰臨擅竒絶佳氣何鬱盤橫以數畝池繚以四面山石楠間女貞青士依蒼官紛紛雜花卉栽植日以繁豈獨秀春融未應凋嵗寒憑欄試游目皎皎萬慮寬張公江海客一見顔為歡嘉名揭種德寓意固有存期君宴游日內照時返觀善性益培壅蕪纍須一刪木老德亦熟無忘老坡言何茂宏茂恭攜酒見過復侑以詩次韻一首薄雲漏朝曦積雨霽中夏白波涵磬湖清影漾茒舍輪蹄絶還往文史富閒暇畏友有機雲英標凜王謝喜尋范張約偕命嵇吕駕豈徒貴密邇聊亦重姻婭戲彩膝才容亦好草可藉瓦碗薦溪毛竹箸羞雞炙劇談掌屢抵糲食咽亦下晚涼過古剎明月耀修架蒲團語上方篝火耿良夜凌晨一瘦藤支徑雙不借長嘯陟雲嶺清吟探石罅嶔岑近明目湍激深沒胯别袂余力摻歸鞍子傭跨何時許重臨倒屣肅邀迓謝葉致政送芍藥佳葩如美人豔態妖且閒葉園美無度有花字雌丹晨粧謝膏沐秀色若可餐芳根裹春泥舉贈不作難照池亭一洗儒生酸從今杜陵眼不復嗟長寒何以報嘉惠作詩當琅玕秋曉野步案此詩據南宋名賢小集增入幽居邇郊原出户目已瞭閒攜一枝竹散步及秋曉寒烟引輕雲淡淡縈木杪矯首矚層穹轉盼失飛鳥野潦淨荒陂驚飈泛枯篠世態徒營營此心殊了了佳處誰與論聊用付清醥

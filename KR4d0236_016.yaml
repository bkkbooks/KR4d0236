body:
  text: 香山集卷十六宋喻良能撰七言絶句次韻鄭季逺國録賢良題余廬山詩記青鞋憶昔到廬山回首清遊夢寐間忽見廣文竒絶句十年風雨喚仍還天姥夢魂勞太白赤城想像賦興公匡廬縹眇煙雲境總在新篇妙句中次韻王待制題豫廬山記後二絶曽到匡君住處山始知身在五雲間吟毫揮盡無佳句空遣奚囊捆載還山阿詩刻照雲松到處逢人問我公白傅蘇仙名不滅公名今在兩賢中荷花花落波間生纈紋香飄風外似爐薰六郎顔色應慚汝八子風流定似君八月十八日觀潮萬疊銀山出海門百川渺渺不勞吞晴江斗起黏天浪一洗忠胥憤屈魂誰遣羣兒把綵幡翩翩驚浪怒濤間不知岸上人皆愕但覺波心意自間次韻郭刪定觀潮四絶白浪初看雲出門驚濤旋見大江奔不因江海雷霆鬬安識蛟龍窟宅尊天池潮汐渺難推何事多盈亦有虧生長濤淵頭縱白問之消息莫能知憶昔初為總角兒年年秋後厭旌旗只今廓廓渾無事樽酒何妨樂聖時身到錢塘江上初端如碧海挂新圖不知洗眼觀潮日豁得平生俊氣無讀侍御去國集次韻卷首赴召先生一飯不忘主詩句端如杜少陵敬讀新編二百首凛然風采照隆興張持荷以二詩見貽不敢虛辱次韻奉酬南湖騎馬似知章熟醉清吟錦瑟傍不分鶩行遮電眼偷間檢校水雲鄉南湖一似錦江園秀句端宜入杜編想得公餘時步屧清風明月不論錢張持荷以詩見約同沈無隱賞梅因得絶句奉謝結齋風味如和靖况有凌風百尺臺雪霽春新多辦酒兩翁乘興欲尋梅自題端溪硯吳興青石今無聞歙郡刷絲端可焚儒生誰是喜書者安得一逢王右軍謝監丞子長雪中四絶水花翦翦墜同雲萬里橫陳似畫坤不見銀杯兼縞帶知誰肯訪席為門國子先生老宦遊十年學省一狐裘飢雷有意鳴蟬腹寒粟無端起玉樓江邊釣雪翁荷苙道上行人馬度橋説與兒童須愛惜莫貪瓊屑撼長條萬玉妃來遣目迷縞裙練帨顫鸞箆令人却憶桐川路粉蘂垂垂照玉溪喜雪次侯宰韻凍筆難成授簡章寒光先到讀書堂亂飄撲面如平叔幾點侵眉似馬良髙國正約飯素淨慈遂至劉寺酌茗于鳯凰泉同遊者蘇太博計撫揮公禪師請公道者蘇計與豫同庚三亥並遊真盛矣二禪入社亦佳哉鳯池一段風流事不欠支郎與辨才春晚春及瓜期夏景生鳴蟬漸欲替啼鶯蜂臣飛急衝殘絮蟻子行忙礙落英荷葉商量貼水開亂紅無數點蒼苔穿簾雙燕復雙燕把酒一杯還一杯喜雨九重午刻命精禱四海中宵同出雲溽暑已隨飛雨散清聲還並曉風聞次韻李同年誠之見貽之什兄弟同登年亦同羡君墨妙更文工我慙潦倒頭仍白擬學韓豪一送窮筆端灑落謫仙人况復曽同桂苑春一笑相逢端莫逆門前洲渚正橫陳李時寓居西湖丁未二月十三日廷和輪對六年不獲面虞皇重對彤墀晝漏長玉色粹溫天一笑歸來滿袖有濃香送樓大防倅丹丘我以疏慵丐外遷公乎何事亦翩然兩家俱有親庭樂且結斑衣自在緣丐外得括蒼東歸侍次一家滿載扁舟裏兩槳春風去似飛漸識路人鄉樹出世間樂事莫如歸十年長客帝王都五畝田園半欲蕪乞得此身猶未老自搖小艇釣平湖永祐陵乘騎導從朝陵日漫山桃李花如織好風吹散半空雲麗日放將新霽色森然一徑趨髙爽鬱蔥佳氣遙相望松聲萬壑奏笙竽山形千疊開屏障小臣生長宣和初深仁浹髓淪肌膚只今白首馮唐似何幸清齋拜鼎湖誓節馬驛讀龍溪詩博山一穗爇沉薰寄傲胡牀笑此身馬隊也知非講肆聊從開府乞清新塗中讀周希稷所示詩卷以詩代簡周郎詩句故驚人爾許清新思不羣不是并刀工翦水定知瓊尺巧裁雲州宅勢壓江巒棟宇雄使君如在廣寒宫微之政以江山助千首詩成咳唾中淳熙己酉上巳前一日蚤與遂昌縣尉葉禾晚與弟良弼姪得之金華監酒何震飲于月山之曲水覽節物之方新欣湖山之如畫率爾成篇曲溝流水緑蜿蜒正值春風上巳天不是永和東道主一觴亦復會羣賢少微閣臨空瞰濶俯清溪閣占黃堂西復西我昔曽攀郎宿近只今人指二星齊簡張子溫運使宗丞矻矻不離口右司時時説解頥豈獨當今三昧手故應勝古四愁詩少陵子厚妙爐錘力不能追心自期杯水平時猶不直試求印可老宗師椿桂堂昔時共説竇家椿今見清門五桂新我亦鄉閭誇盛事比君家尚少三人題吳先生祠先生髙義薄層穹解使池庭化泮宫應笑蘭亭舊豪逸溪山千古寂寥中題挹仙亭鶴駕鸞驂入杳冥望中遺迹照人清只今縹眇煙雲裏應有仙家犬吠聲送王節推夷仲秩滿赴闕紫禁臚傳第四人錦腸貝齒凛長身三年來作諸侯客千里江山隂受春胸中深蟠萬卷餘筆端倒傾蛟室珠掖垣政要舍人樣致主澤民推宿儒戰和未定議紛紜草茅有忠天莫聞公乎行矣陪國論毋愧新亭千載人中年謝傅良多感欲别能忘作惡無今日與公休惜别須知元不隔江湖寄洪舍人二絶人物中朝第一人胸蟠萬卷筆如神調元要倚經綸手黃屋虛心待舊臣仲氏昔嘗司宥密長公元已轉洪鈞紫微豈久承流地黃閣終須報主身平逺臺平逺臺髙俯翠微海天煙雨正霏霏登臨何處明人眼烏石山前白鳥飛吳越王廟五季流民去不還賴君撫有此江山嫌名舉世猶知避何况來瞻廟貌間次韻丁端叔舟中值雪三絶輕舞謝衣端不惡斜侵潘鬢總堪驚偶思功業聊看鏡自怪年來太瘦生但知才出吳公右孰識詩堪子建親不惜剩吟黃竹句何妨傳示白頭人延和初奏三千牘畿甸旋移尺五天風格出塵誰可並爭看遼鶴一千年二月二十八日周提宫葉致政樓司理過訪錦園錦園春色滿西東一笑相歡四老翁八秩總開三百嵗樂天風味此時同錦園不減商山樂四皓中間著此翁今日可無千字作何人似此一樽同千字作謂百韻詩昔樂天與劉夢得裴賔客王尚書飲作詩云四個老人三百嵗今得用以為故事磬湖偶成只欠退之盤谷序已成摩詰輞川圖暮年寧復須西子不用扁舟向五湖次韻黃三以詩分送筍此君稚子别經年忽到茅齋意豁然自愧清貧饞太守嘗新翻在小春前醉題艇齋平生飽識江湖趣今日歸來鬢似絲閉户松風驚醉耳恰如魚浦聽潮時送竹枕與勾希載太博誰人彩斫渭川村有節輪囷秋竹根割我便便春晝睡乞君栩栩夢中魂次韻何茂恭詠玉簪三絶金谷墜樓人已逺樓前首飾尚堪尋誰家玉面雪肌女淡掃蛾眉方稱簪未開黃鈿紫冠小誰與幽人作好秋一笑相看兩不厭翠雲堆裏玉搔頭月露洗沐秋容淨姑山初逢冰雪仙風流水部與藻飾從此梅花應並傳題湖上月林月林風物最湖山十里煙綃映霧鬟欲識丹青難貌處渚鷗汀鷺有無間亦好園菊花盛開為賦二絶風厲霜嚴了不知晚來幽獨更多姿綸巾細漉柴桑酒坐對疏籬却始宜窮秋籬落日蕭蕭淺笑臨風畫亦勞徹骨清寒香未了落英猶更入離騷亦好園海紅黃香梅著子戲成小詩一枝濃艷倚東風千葉輕黃點翠叢占得娉婷仍結子故應花果譜兼通磬湖小山激水作小溪平湖激水轉山流石澗縈紆走碧虬料得丹青無貌處白蘋紅蓼滿汀州連理枝紫荆斜倚磬湖隈並幹連枝錦作堆猶記太虛壇上木舞風雙影並徘徊送李深卿赴省試事業平生在管城䇿勳今日向神京區區一第慁子耳要聽臚傳第一聲曲江深院題名處應有春風得意詩為想杏花三十里却思三五少年時秋日有懷仲文季直二弟案此詩據南宋名賢小集增入微雲初月淡層城絡緯聲連促織清北雁不來千里信西風還起故園情
